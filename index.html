<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>بحر — منصة تواصل اجتماعي نصية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { 
      --sidebar-w: 260px; 
      --feed-w: 600px; 
      --right-w: 320px; 
    }
    
    [data-theme="light"] {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-soft: #f7f9f9;
      --surface-tint: rgba(29,155,240,0.08);
      --border: #eff3f4;
      --ink: #0f1419;
      --muted: #536471;
      --blue: #1d9bf0;
      --blue-hover: #1a8cd8;
      --danger: #f4212e;
      --danger-bg: #fee2e2;
      --header-bg: rgba(255, 255, 255, 0.85);
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
      --scroll: #cfd9de;
    }
    
    [data-theme="dark"] {
      --bg: #000000;
      --surface: #000000;
      --surface-soft: #16181c;
      --surface-tint: rgba(29,155,240,0.15);
      --border: #2f3336;
      --ink: #e7e9ea;
      --muted: #71767b;
      --blue: #1d9bf0;
      --blue-hover: #1a8cd8;
      --danger: #f4212e;
      --danger-bg: rgba(244,33,46,0.15);
      --header-bg: rgba(0, 0, 0, 0.85);
      --shadow: 0 4px 20px rgba(255,255,255,0.05);
      --scroll: #333639;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scrollbar-color: var(--scroll) transparent; scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, sans-serif;
      background: var(--bg); 
      color: var(--ink); 
      line-height: 1.6; 
      overflow-x: hidden;
      transition: background 0.2s ease, color 0.2s ease;
    }
    
    h1, h2, h3, .brand { font-family: "Readex Pro", "IBM Plex Sans Arabic", sans-serif; margin: 0; }
    button, input, textarea, select { font-family: inherit; }
    button { cursor: pointer; }
    .tabular { font-variant-numeric: tabular-nums; }
    
    .layout { display: flex; min-height: 100vh; direction: rtl; justify-content: center; max-width: 1300px; margin: 0 auto; }

    /* ── الشريط الجانبي (Side Navigation) ── */
    .sidebar {
      width: var(--sidebar-w); 
      flex-shrink: 0;
      display: flex; 
      flex-direction: column;
      position: sticky; 
      top: 0; 
      height: 100vh; 
      overflow-y: auto; 
      z-index: 40;
      border-left: 1px solid var(--border); 
      background: var(--bg); 
      padding: 4px 12px 16px;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .sidebar-header { padding: 12px 8px 8px; display: flex; align-items: center; justify-content: space-between; }
    .sidebar-nav { flex: 1; padding: 8px 0; display: flex; flex-direction: column; gap: 4px; }
    
    .sidebar-link {
      display: flex; align-items: center; gap: 18px; padding: 12px 16px; border-radius: 9999px;
      background: none; border: none; color: var(--ink); font-size: 18px; font-weight: 500;
      text-align: right; width: 100%; transition: background 0.15s ease, color 0.15s ease;
    }
    .sidebar-link:hover { background: var(--surface-soft); }
    .sidebar-link.active { color: var(--blue); font-weight: 700; }
    .sidebar-link .icon { font-size: 24px; width: 26px; text-align: center; flex-shrink: 0; }
    .sidebar-link .badge-count { margin-right: auto; background: var(--blue); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; min-width: 20px; text-align: center; }
    
    .sidebar-footer { padding-top: 12px; border-top: 1px solid var(--border); }
    .sidebar-user { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9999px; margin-bottom: 8px; transition: background 0.15s; }
    .sidebar-user:hover { background: var(--surface-soft); }
    .sidebar-user-info { flex: 1; overflow: hidden; }
    .sidebar-user-info .name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-user-info .handle { font-size: 13px; color: var(--muted); }

    .theme-toggle {
      width: 38px; height: 38px; flex-shrink: 0; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface-soft); color: var(--ink);
      font-size: 16px; display: inline-flex; align-items: center; justify-content: center; transition: 0.15s;
    }
    .theme-toggle:hover { background: var(--surface-tint); border-color: var(--blue); }

    /* صندوق البحث في الشريط الجانبي */
    .search-box { padding: 6px 0 12px; position: relative; }
    .search-box input { 
      width: 100%; padding: 11px 42px 11px 16px; background: var(--surface-soft); 
      border: 1px solid transparent; border-radius: 9999px; font-size: 14px; outline: none; color: var(--ink);
      transition: background 0.15s, border-color 0.15s;
    }
    .search-box input:focus { border-color: var(--blue); background: var(--bg); box-shadow: 0 0 0 1px var(--blue); }
    .search-icon { position: absolute; right: 16px; top: 50%; transform: translateY(-70%); font-size: 14px; color: var(--muted); pointer-events: none; }
    .search-results { position: absolute; top: 100%; right: 0; left: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); max-height: 300px; overflow-y: auto; z-index: 100; margin-top: 4px; }
    .search-result-item { padding: 10px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .search-result-item:hover { background: var(--surface-soft); }
    .search-empty { padding: 14px; text-align: center; color: var(--muted); font-size: 13px; }

    /* ── المحتوى الرئيسي (Main Timeline) ── */
    .main-content { flex: 1; min-width: 0; display: flex; justify-content: flex-start; }
    main { padding: 0 0 80px; width: 100%; max-width: 650px; }

    .grid-2 { display: grid; grid-template-columns: minmax(0, var(--feed-w)) var(--right-w); gap: 30px; align-items: start; }
    .grid-2 > .stack:first-child { border-inline-end: 1px solid var(--border); min-height: 100vh; padding-inline-end: 16px; }
    .grid-2 > aside.stack { position: sticky; top: 16px; padding-top: 12px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
    
    /* تصميم البوستات على شكل تويتر */
    article.card { 
      border: none; 
      border-bottom: 1px solid var(--border); 
      border-radius: 0; 
      padding: 14px 16px; 
      background: var(--bg); 
      transition: background 0.15s;
    }
    article.card:hover { background: rgba(0,0,0,0.01); }
    [data-theme="dark"] article.card:hover { background: rgba(255,255,255,0.01); }

    .stack { display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 18px; border-radius: 9999px; border: 1px solid transparent; font-size: 14px; font-weight: 700; white-space: nowrap; transition: background 0.15s, opacity 0.15s; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: var(--blue-hover); }
    .btn-soft { background: var(--surface-tint); color: var(--blue); }
    .btn-ghost { background: transparent; color: var(--muted); border-color: var(--border); }
    .btn-ghost:hover { background: var(--surface-soft); color: var(--ink); }
    .btn-danger { background: var(--danger-bg); color: var(--danger); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .input, textarea, select { width: 100%; padding: 12px 14px; font-size: 14px; color: var(--ink); background: var(--surface-soft); border: 1px solid var(--border); border-radius: 12px; outline: none; transition: border-color 0.15s, background 0.15s; }
    .input:focus, textarea:focus, select:focus { border-color: var(--blue); background: var(--bg); }
    textarea { resize: none; }

    .avatar { border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 700; color: #fff; user-select: none; overflow: hidden; background: var(--surface-soft); }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .av-xs { width: 28px; height: 28px; font-size: 11px; }
    .av-sm { width: 36px; height: 36px; font-size: 13px; }
    .av-md { width: 42px; height: 42px; font-size: 15px; }
    .av-lg { width: 72px; height: 72px; font-size: 26px; }
    .verified { width: 16px; height: 16px; border-radius: 50%; background: var(--blue); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; flex-shrink: 0; }

    .tabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-soft); border: 1px solid var(--border); border-radius: 9999px; }
    .tab-btn { background: none; border: none; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); transition: 0.15s; }
    .tab-btn.active { background: var(--blue); color: #fff; }

    .muted { color: var(--muted); font-size: 12px; }
    .divider { border-top: 1px solid var(--border); margin: 12px 0; }
    .post-text { font-size: 15px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; margin: 10px 0 0; }
    
    .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px; background: var(--surface-soft); border: 1px solid var(--border); border-radius: 12px; max-height: 200px; overflow-y: auto; }
    @media (min-width: 500px) { .avatar-grid { grid-template-columns: repeat(6, 1fr); } }
    .avatar-pick { background: var(--surface); border: 1px solid transparent; border-radius: 10px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .avatar-pick.selected { border-color: var(--blue); background: var(--surface-tint); }
    .avatar-pick .avatar { width: 40px; height: 40px; }

    /* نظام الدردشة */
    .chat-box { display: grid; grid-template-columns: 1fr; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; background: var(--surface); min-height: 520px; }
    @media (min-width: 768px) { .chat-box { grid-template-columns: 280px 1fr; } }
    .chat-list { border-left: 1px solid var(--border); display: flex; flex-direction: column; background: var(--surface); }
    .chat-thread { display: flex; flex-direction: column; background: var(--bg); }
    .chat-msgs { flex: 1; padding: 16px; overflow-y: auto; max-height: 380px; display: flex; flex-direction: column; gap: 10px; }
    .bubble { max-width: 78%; padding: 10px 14px; border-radius: 16px; font-size: 14px; }
    .bubble.mine { align-self: flex-start; background: var(--blue); color: #fff; }
    .bubble.theirs { align-self: flex-end; background: var(--surface-soft); border: 1px solid var(--border); color: var(--ink); }

    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 100; background: var(--ink); color: var(--bg); padding: 10px 20px; border-radius: 999px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow); }
    .modal-backdrop { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-card { width: 100%; max-width: 440px; background: var(--surface); border-radius: 20px; padding: 20px; border: 1px solid var(--border); box-shadow: var(--shadow); }

    /* الهيدر العلوي للموبايل والشريط السفلي */
    .mobile-header { display: none; position: sticky; top: 0; z-index: 45; background: var(--header-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 10px 16px; align-items: center; justify-content: space-between; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 35; backdrop-filter: blur(2px); }
    .sidebar-overlay.open { display: block; }
    .hamburger { background: none; border: none; font-size: 22px; color: var(--ink); padding: 4px; }
    
    .bottom-nav { 
      display: none; position: fixed; bottom: 0; right: 0; left: 0; z-index: 45; 
      background: var(--header-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border); padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); 
      justify-content: space-around; align-items: center;
    }
    .bn-link { position: relative; background: none; border: none; color: var(--muted); font-size: 22px; padding: 8px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: 0.15s; }
    .bn-link.active { color: var(--blue); }
    .bn-link .badge-count { position: absolute; top: 4px; right: 4px; background: var(--blue); color: #fff; font-size: 9px; font-weight: 700; padding: 0 4px; border-radius: 999px; min-width: 14px; text-align: center; }

    /* التجاوب مع مختلف الشاشات */
    @media (min-width: 769px) and (max-width: 1080px) {
      .sidebar { width: 78px; padding: 4px 6px; }
      .sidebar .sidebar-link { justify-content: center; padding: 12px 0; gap: 0; }
      .sidebar .sidebar-link span:not(.icon), .sidebar .sidebar-link .badge-count, .sidebar .sidebar-user-info, .sidebar .brand-btn span:last-child { display: none; }
      .sidebar .search-box { display: none; }
    }
    @media (max-width: 1024px) {
      .grid-2 { grid-template-columns: minmax(0, 1fr); }
      .grid-2 > aside.stack { display: none; }
      .grid-2 > .stack:first-child { border-inline-end: none; padding-inline-end: 0; }
    }
    @media (max-width: 768px) {
      .sidebar { 
        position: fixed; top: 0; right: 0; bottom: 0; width: 280px; height: 100dvh; 
        transform: translateX(100%); box-shadow: -5px 0 25px rgba(0,0,0,0.15); 
      }
      .sidebar.open { transform: translateX(0); }
      .mobile-header { display: flex; }
      .bottom-nav { display: flex; }
      main { padding-bottom: 70px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- الشريط الجانبي -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="brand-btn" onclick="goHome()" style="background:none;border:none;display:flex;align-items:center;gap:10px;color:var(--ink);font-size:20px;font-weight:700">
          <span style="width:34px;height:34px;border-radius:10px;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:16px">⚓</span>
          <span>بحر</span>
        </button>
        <button class="theme-toggle" onclick="toggleTheme()" title="تبديل المظهر" aria-label="تبديل المظهر"><span class="theme-icon">🌙</span></button>
      </div>

      <div class="search-box">
        <input type="text" id="global-search" placeholder="ابحث في بحر..." oninput="handleSearch(this.value)" onfocus="handleSearch(this.value)" />
        <span class="search-icon">🔍</span>
        <div id="search-results"></div>
      </div>

      <nav class="sidebar-nav" id="nav"></nav>
      <div class="sidebar-footer" id="auth-actions"></div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar(false)"></div>

    <!-- هيدر الموبايل العلوي -->
    <div class="mobile-header">
      <button class="hamburger" onclick="toggleSidebar(true)">☰</button>
      <button class="brand-btn" onclick="goHome()" style="background:none;border:none;display:flex;align-items:center;gap:6px;color:var(--ink);font-size:17px;font-weight:700">
        <span style="width:28px;height:28px;border-radius:8px;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px">⚓</span>
        <span>بحر</span>
      </button>
      <button class="theme-toggle" style="width:34px;height:34px" onclick="toggleTheme()" aria-label="تبديل المظهر"><span class="theme-icon">🌙</span></button>
    </div>

    <!-- المحتوى الأساسي -->
    <div class="main-content">
      <main class="container" id="app"></main>
    </div>
  </div>

  <!-- هيدر التنقل السفلي للموبايل -->
  <nav class="bottom-nav" id="bottom-nav"></nav>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script>
  (function () {
    const saved = localStorage.getItem("bahr_theme") || "light";
    document.documentElement.setAttribute("data-theme", saved);
  })();

  function toggleTheme() {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("bahr_theme", next);
    document.querySelectorAll(".theme-icon").forEach((el) => { el.textContent = next === "dark" ? "☀️" : "🌙"; });
  }

  const STORAGE_KEY = "bahr_v2";
  const HOUR_MS = 3600000;
  const DAY_MS = 24 * HOUR_MS;

  const PRESET_AVATARS = [
    { id: "student",  name: "طالب",   seed: "student",  bg: "#dbeafe" },
    { id: "engineer", name: "مهندس",  seed: "engineer", bg: "#d1fae5" },
    { id: "doctor",   name: "طبيب",   seed: "doctor",   bg: "#fee2e2" },
    { id: "teacher",  name: "معلم",   seed: "teacher",  bg: "#fef3c7" },
    { id: "writer",   name: "كاتب",   seed: "writer",   bg: "#ede9fe" },
    { id: "artist",   name: "فنان",   seed: "artist",   bg: "#fce7f3" },
    { id: "pilot",    name: "طيار",   seed: "pilot",    bg: "#e0f2fe" },
    { id: "chef",     name: "طاهي",   seed: "chef",     bg: "#ffedd5" },
    { id: "lawyer",   name: "محامي",  seed: "lawyer",   bg: "#f3f4f6" },
    { id: "nurse",    name: "ممرض",   seed: "nurse",    bg: "#ccfbf1" },
    { id: "manager",  name: "مدير",   seed: "manager",  bg: "#e0e7ff" },
    { id: "designer", name: "مصمم",   seed: "designer", bg: "#fae8ff" },
  ];

  const LETTER_COLORS = ["#0d63a5", "#0e7490", "#1e40af", "#0f766e", "#0369a1", "#1d4ed8"];

  function avatarUrl(seed) {
    return `https://api.dicebear.com/7.x/personas/svg?seed=${encodeURIComponent(seed)}&backgroundColor=dbeafe,d1fae5,fee2e2,fef3c7,ede9fe,fce7f3&radius=50`;
  }

  function initialData() {
    const now = Date.now();
    return {
      settings: { registrationOpen: true, autoDeleteEnabled: false, autoDeleteHours: 24, enabledAvatars: PRESET_AVATARS.map(a => a.id) },
      currentUserId: null,
      nextId: 10,
      users: [
        { id: 1, username: "Mohsen0Tamer", password: "Admin@123456", role: "admin", verified: true, avatarId: "manager", bio: "مالك منصة بحر.", dailyPostLimit: 10, autoDeleteMode: "inherit", createdAt: now }
      ],
      follows: [], posts: [], postLogs: [], conversations: [], reports: [], notifications: []
    };
  }

  if (!localStorage.getItem("bahr_v2_migrated")) {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.setItem("bahr_v2_migrated", "1");
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch {}
    const fresh = initialData();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
    return fresh;
  }

  let db = loadState();
  let ui = {
    view: "discover", feedMode: "following", authMode: "login",
    profileUserId: null, activeChatId: null, adminTab: "users",
    highlightPostId: null, openComments: {}, searchQuery: ""
  };

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
  function uid() { db.nextId += 1; return db.nextId; }
  function esc(str) { return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function currentUser() { return db.users.find((u) => u.id === db.currentUserId) || null; }
  function getUser(id) { return db.users.find((u) => u.id === id) || null; }

  function cleanupSweep() {
    const now = Date.now();
    const gEnabled = db.settings.autoDeleteEnabled;
    const gHours = db.settings.autoDeleteHours || 24;
    db.posts = db.posts.filter((p) => {
      const author = getUser(p.userId);
      if (!author) return false;
      if (author.autoDeleteMode === "disabled") return true;
      if (author.autoDeleteMode === "enabled") {
        return now - p.createdAt < (author.autoDeleteHours || gHours) * HOUR_MS;
      }
      return gEnabled ? now - p.createdAt < gHours * HOUR_MS : true;
    });
    db.conversations = db.conversations.filter((c) => now - c.lastMessageAt < DAY_MS);
    db.postLogs = db.postLogs.filter((l) => now - l.createdAt < 2 * DAY_MS);
    save();
  }

  function toast(msg) {
    const root = document.getElementById("toast-root");
    root.innerHTML = `<div class="toast">${esc(msg)}</div>`;
    clearTimeout(window.__toastT);
    window.__toastT = setTimeout(() => { root.innerHTML = ""; }, 3000);
  }

  function relTime(ts) {
    const m = Math.floor((Date.now() - ts) / 60000);
    if (m < 1) return "الآن";
    if (m < 60) return `منذ ${m} د`;
    const h = Math.floor(m / 60);
    if (h < 24) return `منذ ${h} س`;
    return `منذ ${Math.floor(h / 24)} يوم`;
  }

  function remTime(targetTs) {
    const mins = Math.max(1, Math.ceil((targetTs - Date.now()) / 60000));
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return h > 0 ? `${h} س و ${m} د` : `${m} د`;
  }

  function avatarHtml(user, size = "av-md") {
    if (!user) return "";
    const preset = user.avatarId && db.settings.enabledAvatars.includes(user.avatarId)
      ? PRESET_AVATARS.find((a) => a.id === user.avatarId) : null;
    if (preset) {
      return `<span class="avatar ${size}" style="background:${preset.bg}"><img src="${avatarUrl(preset.seed)}" alt="" loading="lazy" /></span>`;
    }
    let hash = 0;
    for (let i = 0; i < user.username.length; i++) hash = (hash * 31 + user.username.charCodeAt(i)) >>> 0;
    const color = LETTER_COLORS[hash % LETTER_COLORS.length];
    return `<span class="avatar ${size}" style="background:${color};color:#fff">${(user.username.trim()[0] || "ب").toUpperCase()}</span>`;
  }

  function badgeHtml(user) { return user && user.verified ? `<span class="verified" title="حساب موثق">✓</span>` : ""; }

  function getQuota(user) {
    const win = Date.now() - DAY_MS;
    const logs = db.postLogs.filter((l) => l.userId === user.id && l.createdAt > win);
    const limit = Math.max(1, user.dailyPostLimit || 1);
    const remaining = Math.max(0, limit - logs.length);
    return { limit, remaining, nextAt: remaining === 0 && logs[0] ? logs[0].createdAt + DAY_MS : null };
  }

  function toggleSidebar(open) {
    const sb = document.getElementById("sidebar");
    const ov = document.getElementById("sidebar-overlay");
    if (!sb || !ov) return;
    if (open) { sb.classList.add("open"); ov.classList.add("open"); }
    else { sb.classList.remove("open"); ov.classList.remove("open"); }
  }

  function goHome() { ui.view = currentUser() ? "feed" : "discover"; toggleSidebar(false); render(); }
  function setView(v) { ui.view = v; toggleSidebar(false); render(); }
  function openProfile(userId) { ui.profileUserId = userId; ui.view = "profile"; toggleSidebar(false); render(); }

  function handleSearch(query) {
    ui.searchQuery = query.trim();
    const box = document.getElementById("search-results");
    if (!box) return;
    if (ui.searchQuery.length < 1) { box.innerHTML = ""; return; }
    const q = ui.searchQuery.toLowerCase();
    const me = currentUser();
    const results = db.users
      .filter((u) => u.role !== "admin" || (me && me.role === "admin"))
      .filter((u) => u.username.toLowerCase().includes(q) || (u.bio || "").toLowerCase().includes(q))
      .slice(0, 6);
    if (!results.length) { box.innerHTML = `<div class="search-empty">لا توجد نتائج</div>`; return; }
    box.innerHTML = results.map((u) => `
      <div class="search-result-item" onclick="selectSearchResult(${u.id})">
        ${avatarHtml(u, "av-xs")}
        <div style="flex:1;overflow:hidden">
          <div style="font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px">${esc(u.username)} ${badgeHtml(u)}</div>
          ${u.bio ? `<div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(u.bio)}</div>` : ""}
        </div>
      </div>`).join("");
  }

  function selectSearchResult(userId) {
    document.getElementById("global-search").value = "";
    document.getElementById("search-results").innerHTML = "";
    openProfile(userId);
  }

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".search-box")) {
      const box = document.getElementById("search-results");
      if (box) box.innerHTML = "";
    }
  });

  function render() {
    cleanupSweep();
    const me = currentUser();
    const unread = me ? db.notifications.filter((n) => n.userId === me.id && !n.isRead).length : 0;

    const navLinks = [];
    if (me) navLinks.push(["feed", "🏠", "الرئيسية"]);
    navLinks.push(["discover", "🌊", "اكتشف"]);
    if (me && me.role !== "admin") navLinks.push(["chat", "💬", "الرسائل"]);
    if (me) navLinks.push(["notifications", "🔔", "الإشعارات", unread]);
    if (me && me.role === "admin") navLinks.push(["admin", "⚙️", "الإدارة"]);
    if (me) navLinks.push(["profile", "👤", "الملف الشخصي", 0, me.id]);

    document.getElementById("nav").innerHTML = navLinks.map(([id, icon, label, badge, userId]) => {
      const isActive = ui.view === id || (id === "profile" && ui.view === "profile" && ui.profileUserId === me?.id);
      const clickAction = id === "profile" && userId ? `openProfile(${userId})` : `setView('${id}')`;
      return `<button class="sidebar-link ${isActive ? "active" : ""}" onclick="${clickAction}">
        <span class="icon">${icon}</span>
        <span>${label}</span>
        ${badge ? `<span class="badge-count">${badge}</span>` : ""}
      </button>`;
    }).join("");

    const bn = document.getElementById("bottom-nav");
    if (bn) bn.innerHTML = navLinks.map(([id, icon, label, badge, userId]) => {
      const isActive = ui.view === id || (id === "profile" && ui.view === "profile" && ui.profileUserId === me?.id);
      const clickAction = id === "profile" && userId ? `openProfile(${userId})` : `setView('${id}')`;
      return `<button class="bn-link ${isActive ? "active" : ""}" onclick="${clickAction}" aria-label="${label}">
        <span>${icon}</span>
        ${badge ? `<span class="badge-count">${badge}</span>` : ""}
      </button>`;
    }).join("");

    document.getElementById("auth-actions").innerHTML = me ? `
      <div class="sidebar-user">
        ${avatarHtml(me, "av-sm")}
        <div class="sidebar-user-info">
          <div class="name">${esc(me.username)} ${badgeHtml(me)}</div>
          <div class="handle">@${esc(me.username)}</div>
        </div>
      </div>
      <button class="btn btn-danger" style="width:100%;justify-content:center;padding:10px" onclick="logout()">تسجيل الخروج</button>
    ` : `
      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:11px" onclick="setView('auth')">تسجيل الدخول</button>
    `;

    const app = document.getElementById("app");
    if (ui.view === "auth") app.innerHTML = renderAuth();
    else if (ui.view === "profile") app.innerHTML = renderProfile();
    else if (ui.view === "chat" && me) app.innerHTML = renderChat();
    else if (ui.view === "notifications" && me) app.innerHTML = renderNotifications();
    else if (ui.view === "admin" && me && me.role === "admin") app.innerHTML = renderAdmin();
    else app.innerHTML = renderFeed();
  }

  function renderAuth() {
    const regOpen = db.settings.registrationOpen;
    const presets = PRESET_AVATARS.filter((a) => db.settings.enabledAvatars.includes(a.id));
    return `
      <div class="card" style="max-width:440px;margin:30px auto;border:1px solid var(--border)">
        <div class="row-between" style="margin-bottom:20px">
          <div class="tabs">
            <button class="tab-btn ${ui.authMode === "login" ? "active" : ""}" onclick="ui.authMode='login';render()">دخول</button>
            <button class="tab-btn ${ui.authMode === "register" ? "active" : ""}" onclick="ui.authMode='register';render()">حساب جديد</button>
          </div>
          <button class="btn btn-ghost" onclick="setView('discover')">تصفح كضيف</button>
        </div>
        ${ui.authMode === "register" && !regOpen
          ? `<div style="padding:14px;background:var(--danger-bg);color:var(--danger);border-radius:12px;font-size:13px">التسجيل الجديد مغلق حالياً.</div>`
          : `<form onsubmit="submitAuth(event)" class="stack">
              <div>
                <label class="muted">اسم المستخدم</label>
                <input id="auth-u" class="input" required minlength="3" maxlength="24" placeholder="مثال: بحر_هادئ" />
              </div>
              <div>
                <label class="muted">كلمة المرور</label>
                <input id="auth-p" type="password" class="input" required minlength="6" placeholder="••••••" />
              </div>
              ${ui.authMode === "register" ? `
                <div>
                  <label class="muted" style="display:block;margin-bottom:6px">اختر صورة رمزية</label>
                  <div class="avatar-grid">
                    <button type="button" class="avatar-pick ${!window.__pickAv ? "selected" : ""}" onclick="window.__pickAv=null;render()">
                      <span class="avatar" style="background:#1d9bf0;color:#fff;width:40px;height:40px">ب</span>
                      <span style="font-size:9px">الحرف</span>
                    </button>
                    ${presets.map((p) => `
                      <button type="button" class="avatar-pick ${window.__pickAv === p.id ? "selected" : ""}" onclick="window.__pickAv='${p.id}';render()">
                        <span class="avatar" style="background:${p.bg}"><img src="${avatarUrl(p.seed)}" alt="" loading="lazy" /></span>
                        <span style="font-size:9px">${p.name}</span>
                      </button>`).join("")}
                  </div>
                </div>` : ""}
              <button type="submit" class="btn btn-primary" style="margin-top:8px;padding:12px">${ui.authMode === "login" ? "تسجيل الدخول" : "إنشاء حساب جديد"}</button>
            </form>`}
      </div>`;
  }

  function submitAuth(e) {
    e.preventDefault();
    const u = document.getElementById("auth-u").value.trim();
    const p = document.getElementById("auth-p").value;
    if (ui.authMode === "login") {
      const found = db.users.find((x) => x.username.toLowerCase() === u.toLowerCase() && x.password === p);
      if (!found) return toast("بيانات الدخول غير صحيحة");
      db.currentUserId = found.id; save(); ui.view = "feed"; toast("أهلاً بك مجدداً"); render();
    } else {
      if (!db.settings.registrationOpen) return toast("التسجيل مغلق حالياً");
      if (db.users.some((x) => x.username.toLowerCase() === u.toLowerCase())) return toast("اسم المستخدم محجوز مسبقاً");
      const newUser = { id: uid(), username: u, password: p, role: "user", verified: false, avatarId: window.__pickAv || null, bio: "", dailyPostLimit: 1, autoDeleteMode: "inherit", createdAt: Date.now() };
      db.users.push(newUser); db.currentUserId = newUser.id; window.__pickAv = null; save(); ui.view = "feed"; toast("تم إنشاء الحساب بنجاح"); render();
    }
  }

  function logout() { db.currentUserId = null; save(); ui.view = "discover"; toast("تم تسجيل الخروج"); render(); }

  function renderFeed() {
    const me = currentUser();
    const followingIds = me ? db.follows.filter((f) => f.followerId === me.id).map((f) => f.followingId) : [];
    const posts = db.posts.filter((p) => {
      if (!me || ui.view === "discover" || ui.feedMode === "discover") return true;
      return p.userId === me.id || followingIds.includes(p.userId);
    }).sort((a, b) => b.createdAt - a.createdAt);

    let composerHtml = "";
    if (me) {
      const q = getQuota(me);
      composerHtml = q.remaining > 0
        ? `<div class="card" style="border-bottom:1px solid var(--border);border-radius:0"><form onsubmit="publishPost(event)">
             <textarea id="post-input" rows="3" maxlength="500" placeholder="ما الذي يدور في ذهنك؟ (حد أقصى 500 حرف)..." oninput="document.getElementById('char-c').textContent=this.value.length"></textarea>
             <div class="row-between" style="margin-top:10px">
               <span class="muted tabular"><span id="char-c">0</span>/500 · متبقي اليوم: ${q.remaining}</span>
               <button type="submit" class="btn btn-primary" style="padding:7px 18px">تغريد / نشر</button>
             </div>
           </form></div>`
        : `<div class="card" style="border-bottom:1px solid var(--border);border-radius:0;text-align:center"><div style="font-size:14px;font-weight:600">استهلكت حد النشر المتاح اليوم (${q.limit})</div><div class="muted tabular" style="margin-top:4px">متبقي ليعود النشر: ${q.nextAt ? remTime(q.nextAt) : "24 ساعة"}</div></div>`;
    }

    const modeTabs = me && ui.view === "feed"
      ? `<div style="padding:10px 16px;border-bottom:1px solid var(--border);display:flex"><div class="tabs">
           <button class="tab-btn ${ui.feedMode === "following" ? "active" : ""}" onclick="ui.feedMode='following';render()">المتابَعون</button>
           <button class="tab-btn ${ui.feedMode === "discover" ? "active" : ""}" onclick="ui.feedMode='discover';render()">الاستكشاف</button>
         </div></div>` : "";

    const writers = db.users.filter((u) => !me || u.id !== me.id).slice(0, 5);

    return `
      <div class="grid-2">
        <div class="stack" style="gap:0">
          ${modeTabs}
          ${composerHtml}
          ${posts.length ? posts.map(renderPostCard).join("") : `<div class="card muted" style="text-align:center;padding:40px">لا توجد بوستات حالياً. كن أول من يكتب!</div>`}
        </div>
        <aside class="stack">
          <div class="card" style="background:var(--surface-soft);border:none">
            <h3 style="font-size:15px;margin-bottom:12px;font-weight:700">أشخاص قد تعجبك متابعتهم</h3>
            <div class="stack" style="gap:12px">
              ${writers.map((u) => {
                const isF = me && db.follows.some((f) => f.followerId === me.id && f.followingId === u.id);
                return `<div class="row-between">
                  <button style="background:none;border:none;display:flex;align-items:center;gap:8px;color:var(--ink);cursor:pointer;text-align:right" onclick="openProfile(${u.id})">
                    ${avatarHtml(u, "av-sm")}
                    <div>
                      <div style="font-size:13px;font-weight:700;display:flex;align-items:center;gap:3px">${esc(u.username)} ${badgeHtml(u)}</div>
                      <div class="muted" style="font-size:11px">@${esc(u.username)}</div>
                    </div>
                  </button>
                  <button class="btn ${isF ? "btn-soft" : "btn-primary"}" style="padding:5px 12px;font-size:12px" onclick="toggleFollow(${u.id})">${isF ? "متابَع" : "متابعة"}</button>
                </div>`;
              }).join("") || `<div class="muted">لا توجد اقتراحات</div>`}
            </div>
          </div>
        </aside>
      </div>`;
  }

  function renderPostCard(p) {
    const author = getUser(p.userId);
    if (!author) return "";
    const me = currentUser();
    const liked = me && p.likes.includes(me.id);
    const canDel = me && (me.id === p.userId || me.role === "admin");
    const openC = Boolean(ui.openComments[p.id]);
    return `
      <article class="card">
        <div class="row-between">
          <button style="background:none;border:none;display:flex;align-items:center;gap:10px;color:var(--ink);text-align:right;cursor:pointer" onclick="openProfile(${author.id})">
            ${avatarHtml(author, "av-md")}
            <div>
              <div class="row" style="gap:4px"><span style="font-weight:700;font-size:14px">${esc(author.username)}</span>${badgeHtml(author)}</div>
              <div class="muted tabular" style="font-size:11px">${relTime(p.createdAt)}</div>
            </div>
          </button>
          ${canDel ? `<button class="btn btn-danger" style="padding:4px 10px;font-size:11px" onclick="deletePost(${p.id})">حذف</button>` : ""}
        </div>
        <p class="post-text">${esc(p.content)}</p>
        <div class="row" style="gap:24px;margin-top:14px">
          <button class="btn ${liked ? "btn-soft" : "btn-ghost"}" style="padding:4px 8px;font-size:13px;border:none" onclick="toggleLike(${p.id})">❤️ ${p.likes.length}</button>
          <button class="btn btn-ghost" style="padding:4px 8px;font-size:13px;border:none" onclick="ui.openComments[${p.id}]=!ui.openComments[${p.id}];render()">💬 ${p.comments.length}</button>
          <button class="btn btn-ghost" style="padding:4px 8px;font-size:13px;border:none" onclick="sharePost(${p.id})">🔗 مشاركة</button>
        </div>
        ${openC ? `
          <div class="divider"></div>
          <div class="stack" style="gap:8px">
            ${p.comments.map((c) => {
              const cu = getUser(c.userId);
              return `<div style="background:var(--surface-soft);padding:10px 12px;border-radius:12px">
                <div class="row" style="font-size:12px;margin-bottom:2px"><strong>${esc(cu ? cu.username : "")}</strong>${badgeHtml(cu)}<span class="muted">· ${relTime(c.createdAt)}</span></div>
                <div style="font-size:13px">${esc(c.content)}</div>
              </div>`;
            }).join("") || `<div class="muted" style="font-size:12px">لا توجد تعليقات بعد.</div>`}
            ${me ? `<form class="row" style="margin-top:6px" onsubmit="addComment(event, ${p.id})">
              <input id="cm-${p.id}" class="input" maxlength="500" placeholder="اكتب تعليقاً..." style="padding:8px 12px;font-size:13px" />
              <button class="btn btn-primary" type="submit" style="padding:8px 14px;font-size:13px">رد</button>
            </form>` : ""}
          </div>` : ""}
      </article>`;
  }

  function publishPost(e) {
    e.preventDefault();
    const me = currentUser();
    if (!me) return setView("auth");
    const text = document.getElementById("post-input").value.trim();
    if (!text || text.length > 500) return;
    if (getQuota(me).remaining <= 0) return toast("استهلكت حد النشر لليوم");
    const now = Date.now();
    const post = { id: uid(), userId: me.id, content: text, likes: [], comments: [], createdAt: now };
    db.posts.unshift(post);
    db.postLogs.push({ userId: me.id, createdAt: now });
    db.follows.filter((f) => f.followingId === me.id).forEach((f) => {
      db.notifications.unshift({ id: uid(), userId: f.followerId, type: "post", actorId: me.id, postId: post.id, message: `نشر ${me.username} بوستاً جديداً`, isRead: false, createdAt: now });
    });
    save(); toast("تم النشر بنجاح"); render();
  }

  function deletePost(id) { db.posts = db.posts.filter((p) => p.id !== id); save(); toast("تم حذف البوست"); render(); }
  
  function toggleLike(id) {
    const me = currentUser();
    if (!me) return setView("auth");
    const p = db.posts.find((x) => x.id === id);
    if (!p) return;
    const idx = p.likes.indexOf(me.id);
    if (idx >= 0) p.likes.splice(idx, 1);
    else p.likes.push(me.id);
    save(); render();
  }

  function addComment(e, postId) {
    e.preventDefault();
    const me = currentUser();
    if (!me) return setView("auth");
    const inp = document.getElementById(`cm-${postId}`);
    const text = inp.value.trim();
    if (!text || text.length > 500) return;
    const p = db.posts.find((x) => x.id === postId);
    if (!p) return;
    p.comments.push({ id: uid(), userId: me.id, content: text, createdAt: Date.now() });
    save(); render();
  }

  function sharePost(id) {
    navigator.clipboard?.writeText(`${location.origin}${location.pathname}#post-${id}`).catch(() => {});
    toast("تم نسخ رابط البوست");
  }

  function toggleFollow(targetId) {
    const me = currentUser();
    if (!me) return setView("auth");
    if (targetId === me.id) return;
    const idx = db.follows.findIndex((f) => f.followerId === me.id && f.followingId === targetId);
    if (idx >= 0) db.follows.splice(idx, 1);
    else db.follows.push({ followerId: me.id, followingId: targetId });
    save(); render();
  }

  function renderProfile() {
    const u = getUser(ui.profileUserId);
    if (!u) return `<div class="card">المستخدم غير موجود</div>`;
    const me = currentUser();
    const isOwn = me && me.id === u.id;
    const isF = me && db.follows.some((f) => f.followerId === me.id && f.followingId === u.id);
    const followers = db.follows.filter((f) => f.followingId === u.id).length;
    const following = db.follows.filter((f) => f.followerId === u.id).length;
    const userPosts = db.posts.filter((p) => p.userId === u.id).sort((a, b) => b.createdAt - a.createdAt);
    const canChat = me && !isOwn && u.role !== "admin" && me.role !== "admin";
    const presets = PRESET_AVATARS.filter((a) => db.settings.enabledAvatars.includes(a.id));

    return `
      <div class="stack" style="gap:0">
        <div class="card" style="border-bottom:1px solid var(--border);border-radius:0">
          <div class="row-between" style="align-items:flex-start">
            <div class="row" style="gap:14px">
              ${avatarHtml(u, "av-lg")}
              <div>
                <div class="row" style="gap:4px"><h2 style="font-size:18px">${esc(u.username)}</h2>${badgeHtml(u)}</div>
                <div class="muted" style="font-size:13px">@${esc(u.username)}</div>
                ${u.bio ? `<p style="margin:8px 0 0;font-size:14px">${esc(u.bio)}</p>` : ""}
              </div>
            </div>
            <div class="row">
              ${!isOwn ? `<button class="btn ${isF ? "btn-soft" : "btn-primary"}" onclick="toggleFollow(${u.id})">${isF ? "متابَع" : "متابعة"}</button>` : ""}
              ${canChat ? `<button class="btn btn-ghost" onclick="startChat(${u.id})">مراسلة</button>` : ""}
            </div>
          </div>
          <div class="muted tabular" style="margin-top:12px;display:flex;gap:16px">
            <span><strong>${followers}</strong> متابِع</span>
            <span><strong>${following}</strong> يتابِع</span>
            <span><strong>${userPosts.length}</strong> بوست</span>
          </div>
          ${isOwn ? `
            <div class="divider"></div>
            <form onsubmit="saveProfile(event)" class="stack" style="gap:10px">
              <input id="prof-bio" class="input" maxlength="160" value="${esc(u.bio)}" placeholder="اكتب نبذة شخصية قصيرة..." />
              <div class="avatar-grid">
                <button type="button" class="avatar-pick ${!u.avatarId ? "selected" : ""}" onclick="setMyAvatar(null)">
                  <span class="avatar" style="background:#1d9bf0;color:#fff;width:40px;height:40px">${u.username[0]}</span>
                  <span style="font-size:9px">الحرف</span>
                </button>
                ${presets.map((p) => `
                  <button type="button" class="avatar-pick ${u.avatarId === p.id ? "selected" : ""}" onclick="setMyAvatar('${p.id}')">
                    <span class="avatar" style="background:${p.bg}"><img src="${avatarUrl(p.seed)}" alt="" loading="lazy" /></span>
                    <span style="font-size:9px">${p.name}</span>
                  </button>`).join("")}
              </div>
              <button type="submit" class="btn btn-primary" style="align-self:flex-start;padding:6px 16px;font-size:13px">حفظ التعديلات</button>
            </form>` : ""}
        </div>
        ${userPosts.map(renderPostCard).join("") || `<div class="card muted" style="text-align:center;padding:40px">لا توجد بوستات لهذا المستخدم.</div>`}
      </div>`;
  }

  function setMyAvatar(avId) { const me = currentUser(); if (!me) return; me.avatarId = avId; save(); render(); }
  function saveProfile(e) {
    e.preventDefault();
    const me = currentUser();
    if (!me) return;
    me.bio = document.getElementById("prof-bio").value.trim().slice(0, 160);
    save(); toast("تم الحفظ"); render();
  }

  function startChat(targetId) {
    const me = currentUser();
    const target = getUser(targetId);
    if (!me || !target || me.role === "admin" || target.role === "admin") return;
    const u1 = Math.min(me.id, targetId), u2 = Math.max(me.id, targetId);
    let conv = db.conversations.find((c) => c.user1Id === u1 && c.user2Id === u2);
    if (!conv) { conv = { id: uid(), user1Id: u1, user2Id: u2, lastMessageAt: Date.now(), messages: [] }; db.conversations.unshift(conv); save(); }
    ui.activeChatId = conv.id; ui.view = "chat"; render();
  }

  function renderChat() {
    const me = currentUser();
    const myConvs = db.conversations.filter((c) => c.user1Id === me.id || c.user2Id === me.id).sort((a, b) => b.lastMessageAt - a.lastMessageAt);
    const active = myConvs.find((c) => c.id === ui.activeChatId) || myConvs[0] || null;
    if (active) ui.activeChatId = active.id;
    const other = active ? getUser(active.user1Id === me.id ? active.user2Id : active.user1Id) : null;
    const peers = db.users.filter((u) => u.id !== me.id && u.role !== "admin");

    return `
      <div class="chat-box" style="margin:10px">
        <aside class="chat-list">
          <div class="row-between" style="padding:12px;border-bottom:1px solid var(--border)">
            <strong style="font-size:14px">الرسائل</strong>
            <select class="input" style="width:auto;padding:4px 8px;font-size:12px" onchange="if(this.value) startChat(Number(this.value))">
              <option value="">+ جديدة</option>
              ${peers.map((p) => `<option value="${p.id}">${esc(p.username)}</option>`).join("")}
            </select>
          </div>
          <div>
            ${myConvs.map((c) => {
              const o = getUser(c.user1Id === me.id ? c.user2Id : c.user1Id);
              return `<button onclick="ui.activeChatId=${c.id};render()" style="width:100%;text-align:right;border:none;border-bottom:1px solid var(--border);padding:12px;background:${active && active.id === c.id ? "var(--surface-tint)" : "var(--surface)"}">
                <div class="row-between"><strong style="font-size:13px">${esc(o ? o.username : "")}</strong><span class="muted tabular" style="font-size:10px">${c.messages.length}/100</span></div>
                <div class="muted" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px">${esc(c.messages[c.messages.length - 1]?.content || "محادثة جديدة")}</div>
              </button>`;
            }).join("") || `<div class="muted" style="padding:30px;text-align:center">لا توجد محادثات</div>`}
          </div>
        </aside>
        <section class="chat-thread">
          ${!active || !other ? `<div class="muted" style="margin:auto">اختر محادثة من القائمة الجانبية.</div>` : `
            <div class="row-between" style="padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border)">
              <div>
                <span style="font-weight:700;font-size:14px">${esc(other.username)}</span> ${badgeHtml(other)}
                <div class="muted tabular" style="font-size:11px">تُحذف تلقائياً بعد ${remTime(active.lastMessageAt + DAY_MS)}</div>
              </div>
              <button class="btn btn-danger" style="padding:5px 10px;font-size:11px" onclick="reportChat(${active.id})">إبلاغ</button>
            </div>
            <div class="chat-msgs">
              ${active.messages.map((m) => `
                <div class="bubble ${m.senderId === me.id ? "mine" : "theirs"}">
                  <div>${esc(m.content)}</div>
                  <div style="font-size:9px;opacity:0.7;margin-top:2px;text-align:left">${relTime(m.createdAt)}</div>
                </div>`).join("") || `<div class="muted" style="text-align:center;margin:auto">ابدأ الكتابة الآن...</div>`}
            </div>
            ${active.messages.length >= 100
              ? `<div class="muted" style="padding:12px;text-align:center">تم بلوغ الحد الأقصى للمحادثة (100 رسالة)</div>`
              : `<form class="row" style="padding:10px 14px;background:var(--surface);border-top:1px solid var(--border)" onsubmit="sendMsg(event, ${active.id})">
                  <input id="msg-in" class="input" maxlength="500" placeholder="اكتب رسالة..." style="padding:10px;font-size:13px" />
                  <button class="btn btn-primary" type="submit" style="padding:10px 18px">إرسال</button>
                </form>`}
          `}
        </section>
      </div>`;
  }

  function sendMsg(e, convId) {
    e.preventDefault();
    const me = currentUser();
    const conv = db.conversations.find((c) => c.id === convId);
    if (!me || !conv || conv.messages.length >= 100) return;
    const text = document.getElementById("msg-in").value.trim();
    if (!text || text.length > 500) return;
    const now = Date.now();
    conv.messages.push({ id: uid(), senderId: me.id, content: text, createdAt: now });
    conv.lastMessageAt = now;
    save(); render();
  }

  function reportChat(convId) {
    document.getElementById("modal-root").innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-card stack">
          <h3 style="font-size:16px">إبلاغ عن المحادثة</h3>
          <textarea id="rep-reason" rows="3" maxlength="300" placeholder="سبب الإبلاغ..."></textarea>
          <div class="row" style="justify-content:flex-end">
            <button class="btn btn-ghost" onclick="document.getElementById('modal-root').innerHTML=''">إلغاء</button>
            <button class="btn btn-danger" onclick="confirmReport(${convId})">إرسال البلاغ</button>
          </div>
        </div>
      </div>`;
  }

  function confirmReport(convId) {
    const me = currentUser();
    const conv = db.conversations.find((c) => c.id === convId);
    if (!me || !conv) return;
    const reason = document.getElementById("rep-reason").value.trim() || "مخالفة";
    db.reports.unshift({ id: uid(), reporterId: me.id, conversationId: convId, reason, status: "open", snapshot: conv.messages.slice(-10).map(m => ({ username: getUser(m.senderId)?.username, content: m.content })), createdAt: Date.now() });
    save(); document.getElementById("modal-root").innerHTML = ""; toast("تم إرسال البلاغ للإدارة");
  }

  function renderNotifications() {
    const me = currentUser();
    const list = db.notifications.filter((n) => n.userId === me.id);
    return `
      <div class="card" style="border:none;border-radius:0">
        <div class="row-between" style="margin-bottom:14px">
          <h2 style="font-size:18px">الإشعارات</h2>
          <button class="btn btn-soft" style="font-size:12px;padding:5px 12px" onclick="markAllRead()">تحديد الكل كمقروء</button>
        </div>
        <div class="stack" style="gap:8px">
          ${list.map((n) => {
            const actor = n.actorId ? getUser(n.actorId) : null;
            return `<div style="padding:12px 14px;border-radius:12px;background:${n.type === "admin" ? "var(--surface-tint)" : "var(--surface-soft)"}">
              ${n.title ? `<div style="font-size:13px;font-weight:700;color:var(--blue);margin-bottom:2px">${esc(n.title)}</div>` : ""}
              <div style="font-size:14px">${actor && n.type !== "admin" ? `<strong>${esc(actor.username)}</strong> ` : ""}${esc(n.message)}</div>
              <div class="muted" style="margin-top:4px">${relTime(n.createdAt)}</div>
            </div>`;
          }).join("") || `<div class="muted" style="text-align:center;padding:40px">لا توجد إشعارات حالياً.</div>`}
        </div>
      </div>`;
  }

  function markAllRead() { const me = currentUser(); db.notifications.forEach((n) => { if (n.userId === me.id) n.isRead = true; }); save(); render(); }

  function renderAdmin() {
    return `
      <div class="stack" style="padding:10px">
        <div class="card row-between">
          <div>
            <h2 style="font-size:18px">لوحة تحكم الإدارة</h2>
            <div class="muted tabular" style="margin-top:2px">المستخدمون: ${db.users.length} · البوستات: ${db.posts.length} · البلاغات: ${db.reports.filter(r => r.status === 'open').length}</div>
          </div>
          <div class="tabs">
            <button class="tab-btn ${ui.adminTab === "users" ? "active" : ""}" onclick="ui.adminTab='users';render()">المستخدمون</button>
            <button class="tab-btn ${ui.adminTab === "settings" ? "active" : ""}" onclick="ui.adminTab='settings';render()">النظام</button>
            <button class="tab-btn ${ui.adminTab === "mod" ? "active" : ""}" onclick="ui.adminTab='mod';render()">البلاغات</button>
          </div>
        </div>
        ${ui.adminTab === "users" ? `
          <div class="card stack">
            ${db.users.map((u) => `
              <div class="row-between" style="padding:10px 0;border-bottom:1px solid var(--border)">
                <div class="row">${avatarHtml(u, "av-sm")} <strong style="font-size:13px">${esc(u.username)}</strong> ${badgeHtml(u)}</div>
                <div class="row" style="flex-wrap:wrap">
                  <button class="btn ${u.verified ? "btn-primary" : "btn-soft"}" style="padding:4px 10px;font-size:11px" onclick="adminVerify(${u.id})">${u.verified ? "موثّق" : "توثيق"}</button>
                  ${u.role !== "admin" ? `<button class="btn btn-danger" style="padding:4px 10px;font-size:11px" onclick="adminDeleteUser(${u.id})">حذف</button>` : ""}
                </div>
              </div>`).join("")}
          </div>` : ""}
        ${ui.adminTab === "settings" ? `
          <div class="card stack">
            <div class="row-between">
              <div><strong>فتح التسجيل الجديد</strong><div class="muted">السماح بتسجيل أعضاء جدد</div></div>
              <button class="btn ${db.settings.registrationOpen ? "btn-primary" : "btn-danger"}" onclick="db.settings.registrationOpen=!db.settings.registrationOpen;save();render()">${db.settings.registrationOpen ? "مفتوح" : "مغلق"}</button>
            </div>
          </div>` : ""}
        ${ui.adminTab === "mod" ? `
          <div class="card stack">
            <h3>البلاغات المفتوحة</h3>
            ${db.reports.map((r) => `
              <div style="padding:10px;background:var(--surface-soft);border-radius:10px">
                <div class="row-between"><strong style="font-size:13px">بلاغ من ${esc(getUser(r.reporterId)?.username)}</strong><button class="btn btn-soft" style="padding:3px 8px;font-size:11px" onclick="toggleRep(${r.id})">${r.status === 'open' ? 'إغلاق البلاغ' : 'مغلق ✓'}</button></div>
                <div class="muted" style="margin-top:4px">${esc(r.reason)}</div>
              </div>`).join("") || `<div class="muted">لا توجد بلاغات.</div>`}
          </div>` : ""}
      </div>`;
  }

  function adminVerify(id) { const u = getUser(id); if (u) { u.verified = !u.verified; save(); render(); } }
  function adminDeleteUser(id) { db.users = db.users.filter(u => u.id !== id); db.posts = db.posts.filter(p => p.userId !== id); save(); toast("تم حذف المستخدم"); render(); }
  function toggleRep(id) { const r = db.reports.find(x => x.id === id); if (r) { r.status = r.status === 'open' ? 'resolved' : 'open'; save(); render(); } }

  // تحديث أيقونة الثيم عند البداية
  document.querySelectorAll(".theme-icon").forEach((el) => { el.textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "☀️" : "🌙"; });
  render();
  </script>
</body>
</html>
