<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>بحر — منصة تواصل اجتماعي نصية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --sidebar-w: 250px; --feed-w: 600px; --right-w: 330px; }
    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-soft: #f1f5f9;
      --surface-tint: rgba(29,155,240,0.10);
      --border: #e2e8f0;
      --ink: #0f1419;
      --muted: #536471;
      --blue: #1d9bf0;
      --blue-hover: #1a8cd8;
      --teal: #0e8a8a;
      --danger: #f4212e;
      --danger-bg: #fee2e2;
      --header-bg: rgba(255,255,255,0.85);
      --shadow: 0 8px 24px rgba(15,20,25,0.08);
      --scroll: #cfd9de;
    }
    [data-theme="dark"] {
      --bg: #000000;
      --surface: #000000;
      --surface-soft: #16181c;
      --surface-tint: rgba(29,155,240,0.15);
      --border: #2f3336;
      --ink: #e7e9ea;
      --muted: #71767b;
      --blue: #1d9bf0;
      --blue-hover: #1a8cd8;
      --teal: #2dd4bf;
      --danger: #f4212e;
      --danger-bg: rgba(244,33,46,0.12);
      --header-bg: rgba(0,0,0,0.78);
      --shadow: 0 8px 24px rgba(255,255,255,0.10);
      --scroll: #333639;
    }
    * { box-sizing: border-box; }
    html { scrollbar-color: var(--scroll) transparent; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--ink); line-height: 1.6; overflow-x: hidden;
      transition: background 0.25s, color 0.25s;
    }
    h1, h2, h3, .brand { font-family: "Readex Pro", "IBM Plex Sans Arabic", sans-serif; margin: 0; }
    button, input, textarea, select { font-family: inherit; }
    button { cursor: pointer; }
    .tabular { font-variant-numeric: tabular-nums; }
    .container { width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 12px; }

    .layout { display: flex; min-height: 100vh; direction: rtl; }

    /* الشريط الجانبي */
    .sidebar {
      width: var(--sidebar-w); flex-shrink: 0;
      display: flex; flex-direction: column;
      position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 40;
      border-left: 1px solid var(--border); background: var(--bg); padding: 0 10px;
      transition: transform 0.25s ease;
    }
    .sidebar-header { padding: 14px 8px 4px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .sidebar-nav { flex: 1; padding: 8px 2px; display: flex; flex-direction: column; gap: 2px; }
    .sidebar-link {
      display: flex; align-items: center; gap: 16px; padding: 12px 14px; border-radius: 9999px;
      background: none; border: none; color: var(--ink); font-size: 17px; font-weight: 500;
      text-align: right; width: 100%; transition: 0.15s;
    }
    .sidebar-link:hover { background: var(--surface-soft); }
    .sidebar-link.active { color: var(--blue); font-weight: 700; }
    .sidebar-link .icon { font-size: 22px; width: 28px; text-align: center; flex-shrink: 0; }
    .sidebar-link .badge-count { margin-right: auto; background: var(--blue); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; min-width: 18px; text-align: center; }
    .sidebar-footer { padding: 10px 6px 16px; border-top: 1px solid var(--border); }
    .sidebar-user { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 14px; margin-bottom: 8px; transition: 0.15s; }
    .sidebar-user:hover { background: var(--surface-soft); }
    .sidebar-user-info { flex: 1; overflow: hidden; }
    .sidebar-user-info .name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-user-info .handle { font-size: 12px; color: var(--muted); }
    .theme-toggle {
      width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface-soft); color: var(--ink);
      font-size: 17px; display: inline-flex; align-items: center; justify-content: center; transition: 0.15s;
    }
    .theme-toggle:hover { background: var(--surface-tint); border-color: var(--blue); }

    /* البحث */
    .search-box { padding: 10px 2px 12px; border-bottom: 1px solid var(--border); position: relative; }
    .search-box input { width: 100%; padding: 10px 38px 10px 14px; background: var(--surface-soft); border: 1px solid var(--border); border-radius: 9999px; font-size: 14px; outline: none; color: var(--ink); }
    .search-box input:focus { border-color: var(--blue); background: var(--bg); }
    .search-icon { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--muted); pointer-events: none; }
    .search-results { position: absolute; top: 100%; right: 2px; left: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); max-height: 320px; overflow-y: auto; z-index: 100; margin-top: 6px; }
    .search-result-item { padding: 10px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .search-result-item:hover { background: var(--surface-soft); }
    .search-result-item:last-child { border-bottom: none; }
    .search-empty { padding: 16px; text-align: center; color: var(--muted); font-size: 13px; }

    /* المحتوى الرئيسي */
    .main-content { flex: 1; min-width: 0; display: flex; justify-content: center; }
    main { padding: 0 0 90px; width: 100%; }

    .grid-2 { display: grid; grid-template-columns: minmax(0, var(--feed-w)) var(--right-w); gap: 0 28px; align-items: start; justify-content: center; }
    .grid-2 > .stack:first-child { border-inline: 1px solid var(--border); padding: 10px 16px 0; min-height: 100vh; }
    .grid-2 > aside.stack { position: sticky; top: 14px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    article.card { border: 1px solid var(--border); border-radius: 16px; padding: 18px; background: var(--surface); margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 18px; border-radius: 9999px; border: 1px solid transparent; font-size: 13px; font-weight: 700; white-space: nowrap; transition: 0.15s; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: var(--blue-hover); }
    .btn-soft { background: var(--surface-tint); color: var(--blue); }
    .btn-soft:hover { background: rgba(29,155,240,0.2); }
    .btn-ghost { background: transparent; color: var(--muted); border-color: var(--border); }
    .btn-ghost:hover { background: var(--surface-soft); color: var(--ink); }
    .btn-danger { background: var(--danger-bg); color: var(--danger); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .input, textarea, select { width: 100%; padding: 10px 14px; font-size: 14px; color: var(--ink); background: transparent; border: 1px solid var(--border); border-radius: 12px; outline: none; }
    .input:focus, textarea:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
    textarea { resize: vertical; background: var(--surface-soft); }

    .avatar { border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 700; color: #fff; user-select: none; overflow: hidden; background: var(--surface-soft); }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .av-xs { width: 28px; height: 28px; font-size: 12px; }
    .av-sm { width: 36px; height: 36px; font-size: 14px; }
    .av-md { width: 44px; height: 44px; font-size: 16px; }
    .av-lg { width: 68px; height: 68px; font-size: 26px; }
    .verified { width: 17px; height: 17px; border-radius: 9999px; background: var(--blue); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; }

    .tabs { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 4px; background: var(--surface-soft); border: 1px solid var(--border); border-radius: 9999px; }
    .tab-btn { background: none; border: none; padding: 7px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); transition: 0.15s; }
    .tab-btn.active { background: var(--blue); color: #fff; }

    .muted { color: var(--muted); font-size: 12px; }
    .divider { border-top: 1px solid var(--border); margin: 14px 0; }
    .post-text { font-size: 15.5px; line-height: 1.85; white-space: pre-wrap; word-break: break-word; margin: 14px 0 0; }
    .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px; background: var(--surface-soft); border: 1px solid var(--border); border-radius: 12px; max-height: 220px; overflow-y: auto; }
    @media (min-width: 500px) { .avatar-grid { grid-template-columns: repeat(6, 1fr); } }
    .avatar-pick { background: var(--surface); border: 1px solid transparent; border-radius: 10px; padding: 5px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .avatar-pick.selected { border-color: var(--blue); background: var(--surface-tint); }
    .avatar-pick .avatar { width: 44px; height: 44px; }

    /* الشات */
    .chat-box { display: grid; grid-template-columns: 1fr; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; background: var(--surface); min-height: 520px; }
    @media (min-width: 820px) { .chat-box { grid-template-columns: 300px 1fr; } }
    .chat-list { border-left: 1px solid var(--border); display: flex; flex-direction: column; background: var(--surface); }
    .chat-thread { display: flex; flex-direction: column; background: var(--bg); }
    .chat-msgs { flex: 1; padding: 16px; overflow-y: auto; max-height: 380px; display: flex; flex-direction: column; gap: 10px; }
    .bubble { max-width: 78%; padding: 10px 14px; border-radius: 16px; font-size: 14px; }
    .bubble.mine { align-self: flex-start; background: var(--blue); color: #fff; }
    .bubble.theirs { align-self: flex-end; background: var(--surface); border: 1px solid var(--border); color: var(--ink); }

    .toast { position: fixed; bottom: 86px; left: 50%; transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 13px; box-shadow: var(--shadow); }
    .modal-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(15,20,25,0.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-card { width: 100%; max-width: 460px; background: var(--surface); border-radius: 16px; padding: 20px; border: 1px solid var(--border); }

    /* هيدر الجوال والشريط السفلي العائم مثل صورتك */
    .mobile-header { display: none; position: sticky; top: 0; z-index: 45; background: var(--header-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 10px 14px; align-items: center; justify-content: space-between; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(15,20,25,0.55); z-index: 35; }
    .sidebar-overlay.open { display: block; }
    .hamburger { background: none; border: none; font-size: 22px; color: var(--ink); padding: 4px; width: 40px; height: 40px; border-radius: 999px; }
    .hamburger:hover { background: var(--surface-soft); }
    
    .bottom-nav { display: none; position: fixed; bottom: 12px; right: 12px; left: 12px; z-index: 45; background: #1a202c; border-radius: 9999px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); padding: 6px 12px; align-items: center; justify-content: space-around; direction: rtl; }
    [data-theme="light"] .bottom-nav { background: #1e293b; }
    .bn-link { background: none; border: none; color: #94a3b8; font-size: 13px; font-weight: 600; padding: 8px 14px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; transition: 0.15s; white-space: nowrap; }
    .bn-link:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .bn-link.active { background: #334155; color: #fff; font-weight: 700; }
    .bn-link .badge-count { margin-right: 4px; background: var(--blue); color: #fff; font-size: 10px; font-weight: 700; padding: 0 6px; border-radius: 999px; }

    @media (max-width: 1000px) {
      .grid-2 { grid-template-columns: minmax(0, var(--feed-w)); }
      .grid-2 > aside.stack { display: none; }
    }
    @media (max-width: 768px) {
      .sidebar { position: fixed; top: 0; right: 0; bottom: 0; width: 262px; height: 100dvh; transform: translateX(100%); box-shadow: var(--shadow); }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-right: 0; }
      .mobile-header { display: flex; }
      .bottom-nav { display: flex; }
      .container { padding: 0 8px; }
      .grid-2 { grid-template-columns: minmax(0, 1fr); gap: 0; }
      .grid-2 > aside.stack { display: none; }
      .grid-2 > .stack:first-child { border-inline: none; padding: 8px 6px 0; }
      article.card { padding: 14px 12px; margin-bottom: 12px; }
      .toast { bottom: 80px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="brand-btn" onclick="goHome()" style="background:none;border:none;display:flex;align-items:center;gap:10px;color:var(--ink);font-size:20px;font-weight:700">
          <span style="width:32px;height:32px;border-radius:10px;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center">⚓</span>
          <span>بحر</span>
        </button>
        <button class="theme-toggle" onclick="toggleTheme()" title="الوضع الفاتح / الداكن" aria-label="تبديل المظهر"><span class="theme-icon">🌙</span></button>
      </div>

      <div class="search-box">
        <input type="text" id="global-search" placeholder="ابحث عن مستخدم..." oninput="handleSearch(this.value)" onfocus="handleSearch(this.value)" />
        <span class="search-icon">🔍</span>
        <div id="search-results"></div>
      </div>

      <nav class="sidebar-nav" id="nav"></nav>

      <div class="sidebar-footer" id="auth-actions"></div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar(false)"></div>

    <div class="mobile-header">
      <button class="hamburger" onclick="toggleSidebar(true)">☰</button>
      <button class="brand-btn" onclick="goHome()" style="background:none;border:none;display:flex;align-items:center;gap:8px;color:var(--ink);font-size:18px;font-weight:700">
        <span style="width:28px;height:28px;border-radius:8px;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px">⚓</span>
        <span>بحر</span>
      </button>
      <div class="row" style="gap:8px">
        <button class="btn btn-primary" style="padding:6px 14px;font-size:12px;" onclick="setView('auth')">تسجيل الدخول</button>
        <button class="theme-toggle" style="width:34px;height:34px" onclick="toggleTheme()" aria-label="تبديل المظهر"><span class="theme-icon">🌙</span></button>
      </div>
    </div>

    <div class="main-content">
      <main class="container" id="app"></main>
    </div>
  </div>

  <nav class="bottom-nav" id="bottom-nav"></nav>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script>
  (function () {
    const saved = localStorage.getItem("bahr_theme") || "light";
    document.documentElement.setAttribute("data-theme", saved);
  })();
  function toggleTheme() {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("bahr_theme", next);
    document.querySelectorAll(".theme-icon").forEach((el) => { el.textContent = next === "dark" ? "☀️" : "🌙"; });
  }

  const STORAGE_KEY = "bahr_v2";
  const HOUR_MS = 3600000;
  const DAY_MS = 24 * HOUR_MS;

  const PRESET_AVATARS = [
    { id: "student",  name: "طالب",   seed: "student",  bg: "#dbeafe" },
    { id: "engineer", name: "مهندس",  seed: "engineer", bg: "#d1fae5" },
    { id: "doctor",   name: "طبيب",   seed: "doctor",   bg: "#fee2e2" },
    { id: "teacher",  name: "معلم",   seed: "teacher",  bg: "#fef3c7" },
    { id: "writer",   name: "كاتب",   seed: "writer",   bg: "#ede9fe" },
    { id: "artist",   name: "فنان",   seed: "artist",   bg: "#fce7f3" },
    { id: "pilot",    name: "طيار",   seed: "pilot",    bg: "#e0f2fe" },
    { id: "chef",     name: "طاهي",   seed: "chef",     bg: "#ffedd5" },
    { id: "lawyer",   name: "محامي",  seed: "lawyer",   bg: "#f3f4f6" },
    { id: "nurse",    name: "ممرض",   seed: "nurse",    bg: "#ccfbf1" },
    { id: "manager",  name: "مدير",   seed: "manager",  bg: "#e0e7ff" },
    { id: "designer", name: "مصمم",   seed: "designer", bg: "#fae8ff" },
  ];

  const LETTER_COLORS = ["#0d63a5", "#0e7490", "#1e40af", "#0f766e", "#0369a1", "#1d4ed8", "#155e75"];

  function avatarUrl(seed) {
    return `https://api.dicebear.com/7.x/personas/svg?seed=${encodeURIComponent(seed)}&backgroundColor=dbeafe,d1fae5,fee2e2,fef3c7,ede9fe,fce7f3&radius=50`;
  }

  function initialData() {
    const now = Date.now();
    return {
      settings: { registrationOpen: true, autoDeleteEnabled: false, autoDeleteHours: 24, enabledAvatars: PRESET_AVATARS.map((a) => a.id) },
      currentUserId: null,
      nextId: 10,
      users: [
        { id: 1, username: "Mohsen0Tamer", password: "Admin@123456", role: "admin", verified: true, avatarId: "manager", bio: "مالك منصة بحر.", dailyPostLimit: 10, autoDeleteMode: "inherit", createdAt: now },
        { id: 2, username: "سارة_البحرية", password: "password123", role: "user", verified: true, avatarId: "writer", bio: "كاتبة محتوى", dailyPostLimit: 1, autoDeleteMode: "inherit", createdAt: now - 3600000 },
        { id: 3, username: "عمر_الشاطئ", password: "password123", role: "user", verified: true, avatarId: "pilot", bio: "رحالة", dailyPostLimit: 1, autoDeleteMode: "inherit", createdAt: now - 7200000 }
      ],
      follows: [],
      posts: [
        { id: 1, userId: 2, content: "أجمل ما في كتابة فكرة واحدة في اليوم هو أنك تختار كلماتك كما يختار المسافر حقيبته: لا تحمل معك إلا ما يستحق البقاء.", likes: [1, 3], comments: [], createdAt: now - 7200000 },
        { id: 2, userId: 3, content: "الهدوء ليس غياب الأصوات، بل غياب العجلة.", likes: [1], comments: [], createdAt: now - 18000000 }
      ],
      postLogs: [],
      conversations: [],
      reports: [],
      notifications: [],
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch {}
    const fresh = initialData();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
    return fresh;
  }

  let db = loadState();
  let ui = {
    view: "discover",
    feedMode: "following",
    authMode: "login",
    profileUserId: null,
    activeChatId: null,
    adminTab: "users",
    highlightPostId: null,
    openComments: {},
    searchQuery: "",
  };

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
  function uid() { db.nextId += 1; return db.nextId; }
  function esc(str) { return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function currentUser() { return db.users.find((u) => u.id === db.currentUserId) || null; }
  function getUser(id) { return db.users.find((u) => u.id === id) || null; }

  function cleanupSweep() {
    const now = Date.now();
    const gEnabled = db.settings.autoDeleteEnabled;
    const gHours = db.settings.autoDeleteHours || 24;
    db.posts = db.posts.filter((p) => {
      const author = getUser(p.userId);
      if (!author) return false;
      if (author.autoDeleteMode === "disabled") return true;
      if (author.autoDeleteMode === "enabled") {
        const hrs = author.autoDeleteHours || gHours;
        return now - p.createdAt < hrs * HOUR_MS;
      }
      if (gEnabled) return now - p.createdAt < gHours * HOUR_MS;
      return true;
    });
    save();
  }

  function toast(msg) {
    const root = document.getElementById("toast-root");
    root.innerHTML = `<div class="toast">${esc(msg)}</div>`;
    clearTimeout(window.__toastT);
    window.__toastT = setTimeout(() => { root.innerHTML = ""; }, 3000);
  }

  function relTime(ts) {
    const m = Math.floor((Date.now() - ts) / 60000);
    if (m < 1) return "الآن";
    if (m < 60) return `منذ ${m} د`;
    const h = Math.floor(m / 60);
    if (h < 24) return `منذ ${h} س`;
    return `منذ ${Math.floor(h / 24)} يوم`;
  }

  function avatarHtml(user, size = "av-md") {
    if (!user) return "";
    const preset = user.avatarId && db.settings.enabledAvatars.includes(user.avatarId)
      ? PRESET_AVATARS.find((a) => a.id === user.avatarId) : null;
    if (preset) {
      return `<span class="avatar ${size}" style="background:${preset.bg}" title="${esc(preset.name)}"><img src="${avatarUrl(preset.seed)}" alt="${esc(preset.name)}" loading="lazy" /></span>`;
    }
    let hash = 0;
    for (let i = 0; i < user.username.length; i++) hash = (hash * 31 + user.username.charCodeAt(i)) >>> 0;
    const color = LETTER_COLORS[hash % LETTER_COLORS.length];
    const letter = (user.username.trim()[0] || "ب").toUpperCase();
    return `<span class="avatar ${size}" style="background:${color};color:#fff">${esc(letter)}</span>`;
  }

  function badgeHtml(user) { return user && user.verified ? `<span class="verified" title="حساب موثق">✓</span>` : ""; }

  function getQuota(user) {
    const win = Date.now() - DAY_MS;
    const logs = db.postLogs.filter((l) => l.userId === user.id && l.createdAt > win).sort((a, b) => a.createdAt - b.createdAt);
    const limit = Math.max(1, user.dailyPostLimit || 1);
    const remaining = Math.max(0, limit - logs.length);
    return { limit, remaining, nextAt: remaining === 0 && logs[0] ? logs[0].createdAt + DAY_MS : null };
  }

  function toggleSidebar(open) {
    const sb = document.getElementById("sidebar");
    const ov = document.getElementById("sidebar-overlay");
    if (!sb || !ov) return;
    if (open) { sb.classList.add("open"); ov.classList.add("open"); }
    else { sb.classList.remove("open"); ov.classList.remove("open"); }
  }

  function handleSearch(query) {
    ui.searchQuery = query.trim();
    const box = document.getElementById("search-results");
    if (!box) return;
    if (ui.searchQuery.length < 1) { box.innerHTML = ""; return; }
    const q = ui.searchQuery.toLowerCase();
    const me = currentUser();
    const results = db.users
      .filter((u) => u.role !== "admin" || (me && me.role === "admin"))
      .filter((u) => u.username.toLowerCase().includes(q) || (u.bio || "").toLowerCase().includes(q))
      .slice(0, 8);
    if (!results.length) { box.innerHTML = `<div class="search-results"><div class="search-empty">لا توجد نتائج</div></div>`; return; }
    box.innerHTML = `<div class="search-results">${results.map((u) => `
      <div class="search-result-item" onclick="selectSearchResult(${u.id})">
        ${avatarHtml(u, "av-xs")}
        <div style="flex:1;overflow:hidden">
          <div style="font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px">${esc(u.username)} ${badgeHtml(u)}</div>
          ${u.bio ? `<div style="font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(u.bio)}</div>` : ""}
        </div>
      </div>`).join("")}</div>`;
  }

  function selectSearchResult(userId) {
    document.getElementById("global-search").value = "";
    document.getElementById("search-results").innerHTML = "";
    openProfile(userId);
  }

  function goHome() { ui.view = currentUser() ? "feed" : "discover"; toggleSidebar(false); render(); }
  function setView(v) { ui.view = v; toggleSidebar(false); render(); }
  function openProfile(userId) { ui.profileUserId = userId; ui.view = "profile"; toggleSidebar(false); render(); }

  function render() {
    cleanupSweep();
    const me = currentUser();
    const unread = me ? db.notifications.filter((n) => n.userId === me.id && !n.isRead).length : 0;

    const navLinks = [];
    if (me) navLinks.push(["feed", "🏠", "الرئيسية"]);
    navLinks.push(["discover", "🌊", "اكتشف"]);
    if (me && me.role !== "admin") navLinks.push(["chat", "💬", "الرسائل"]);
    if (me) navLinks.push(["notifications", "🔔", "الإشعارات", unread]);
    if (me && me.role === "admin") navLinks.push(["admin", "⚙️", "لوحة الإدارة"]);
    if (me) navLinks.push(["profile", "👤", "ملفي الشخصي", 0, me.id]);

    document.getElementById("nav").innerHTML = navLinks.map(([id, icon, label, badge, userId]) => {
      const isActive = ui.view === id || (id === "profile" && ui.view === "profile" && ui.profileUserId === me?.id);
      const clickAction = id === "profile" && userId ? `openProfile(${userId})` : `setView('${id}')`;
      return `<button class="sidebar-link ${isActive ? "active" : ""}" onclick="${clickAction}">
        <span class="icon">${icon}</span>
        <span>${label}</span>
        ${badge ? `<span class="badge-count">${badge}</span>` : ""}
      </button>`;
    }).join("");

    const bn = document.getElementById("bottom-nav");
    if (bn) {
      bn.innerHTML = `
        <button class="bn-link ${ui.view === 'chat' ? 'active' : ''}" onclick="setView('chat')">محادثة</button>
        <button class="bn-link ${ui.view === 'discover' || ui.view === 'feed' ? 'active' : ''}" onclick="setView('discover')">معاينة</button>
        <button class="bn-link" onclick="setView('discover')">القطع الأثرية</button>
      `;
    }

    document.getElementById("auth-actions").innerHTML = me ? `
      <div class="sidebar-user">
        ${avatarHtml(me, "av-sm")}
        <div class="sidebar-user-info">
          <div class="name">${esc(me.username)} ${badgeHtml(me)}</div>
          <div class="handle">@${esc(me.username)}</div>
        </div>
      </div>
      <button class="btn btn-danger" style="width:100%;justify-content:center" onclick="logout()">تسجيل الخروج</button>
    ` : `
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="setView('auth')">تسجيل الدخول</button>
    `;

    const app = document.getElementById("app");
    if (ui.view === "auth") app.innerHTML = renderAuth();
    else if (ui.view === "profile") app.innerHTML = renderProfile();
    else if (ui.view === "chat" && me) app.innerHTML = renderChat();
    else if (ui.view === "notifications" && me) app.innerHTML = renderNotifications();
    else if (ui.view === "admin" && me && me.role === "admin") app.innerHTML = renderAdmin();
    else app.innerHTML = renderFeed();
  }

  function renderAuth() {
    return `
      <div class="card" style="max-width:520px;margin:20px auto;">
        <div class="row-between" style="margin-bottom:16px">
          <div class="tabs">
            <button class="tab-btn ${ui.authMode === "login" ? "active" : ""}" onclick="ui.authMode='login';render()">تسجيل الدخول</button>
            <button class="tab-btn ${ui.authMode === "register" ? "active" : ""}" onclick="ui.authMode='register';render()">حساب جديد</button>
          </div>
          <button class="btn btn-ghost" onclick="setView('discover')">تصفح</button>
        </div>
        <form onsubmit="submitAuth(event)" class="stack">
          <div>
            <label class="muted">اسم المستخدم</label>
            <input id="auth-u" class="input" required minlength="3" maxlength="24" placeholder="اسم المستخدم" />
          </div>
          <div>
            <label class="muted">كلمة المرور</label>
            <input id="auth-p" type="password" class="input" required minlength="6" placeholder="••••••" />
          </div>
          <button type="submit" class="btn btn-primary">${ui.authMode === "login" ? "دخول إلى بحر" : "إنشاء حساب"}</button>
        </form>
      </div>`;
  }

  function submitAuth(e) {
    e.preventDefault();
    const u = document.getElementById("auth-u").value.trim();
    const p = document.getElementById("auth-p").value;
    if (ui.authMode === "login") {
      const found = db.users.find((x) => x.username.toLowerCase() === u.toLowerCase() && x.password === p);
      if (!found) return toast("بيانات الدخول غير صحيحة");
      db.currentUserId = found.id; save(); ui.view = "feed"; toast("أهلاً بك في بحر"); render();
    } else {
      if (db.users.some((x) => x.username.toLowerCase() === u.toLowerCase())) return toast("اسم المستخدم محجوز");
      const newUser = { id: uid(), username: u, password: p, role: "user", verified: false, avatarId: null, bio: "", dailyPostLimit: 1, autoDeleteMode: "inherit", createdAt: Date.now() };
      db.users.push(newUser); db.currentUserId = newUser.id; save(); ui.view = "feed"; toast("تم إنشاء الحساب بنجاح"); render();
    }
  }

  function logout() { db.currentUserId = null; save(); ui.view = "discover"; toast("تم تسجيل الخروج"); render(); }

  function renderFeed() {
    const me = currentUser();
    const posts = db.posts.sort((a, b) => b.createdAt - a.createdAt);

    let composerHtml = "";
    if (me) {
      const q = getQuota(me);
      composerHtml = q.remaining > 0
        ? `<div class="card"><form onsubmit="publishPost(event)">
             <textarea id="post-input" rows="3" maxlength="500" placeholder="شارك فكرة نصية هادئة اليوم..."></textarea>
             <div class="row-between" style="margin-top:10px">
               <span class="muted tabular">المتبقي اليوم: ${q.remaining} من ${q.limit}</span>
               <button type="submit" class="btn btn-primary">نشر البوست</button>
             </div>
           </form></div>`
        : `<div class="card"><div style="font-size:14px;font-weight:600">استهلكت حد النشر المتاح خلال 24 ساعة</div></div>`;
    } else {
      composerHtml = `<div class="card" style="text-align:center; padding: 24px;">
        <h2 style="font-size:22px; margin-bottom: 8px;">أهلاً بك في بحر</h2>
        <div class="muted" style="margin-bottom: 16px;">منصة نصية هادئة؛ بوست واحد كل 24 ساعة حتى 500 حرف، بدون رفع صور.</div>
        <button class="btn btn-primary" onclick="setView('auth')" style="padding: 10px 28px;">سجّل أو ادخل الآن</button>
      </div>`;
    }

    return `
      <div class="grid-2">
        <div class="stack">
          ${composerHtml}
          ${posts.length ? posts.map(renderPostCard).join("") : `<div class="card muted" style="text-align:center">لا توجد بوستات بعد.</div>`}
        </div>
        <aside class="stack">
          <div class="card muted" style="line-height:1.8">
            <strong style="color:var(--ink);display:block;margin-bottom:4px">ميثاق بحر</strong>
            بوست نصي واحد كل 24 ساعة بدون رفع صور، ومحادثات مؤقتة تُحذف بعد 24 ساعة.
          </div>
        </aside>
      </div>`;
  }

  function renderPostCard(p) {
    const author = getUser(p.userId);
    if (!author) return "";
    const me = currentUser();
    const liked = me && p.likes.includes(me.id);
    const canDel = me && (me.id === p.userId || me.role === "admin");
    return `
      <article class="card">
        <div class="row-between">
          <button style="background:none;border:none;display:flex;align-items:center;gap:10px;color:var(--ink);cursor:pointer" onclick="openProfile(${author.id})">
            ${avatarHtml(author, "av-md")}
            <div style="text-align:right">
              <div class="row" style="gap:5px"><span>${esc(author.username)}</span>${badgeHtml(author)}</div>
              <div class="muted tabular">${relTime(p.createdAt)}</div>
            </div>
          </button>
          ${canDel ? `<button class="btn btn-danger" style="padding:5px 10px;font-size:11px" onclick="deletePost(${p.id})">حذف</button>` : ""}
        </div>
        <p class="post-text">${esc(p.content)}</p>
        <div class="divider"></div>
        <div class="row" style="gap:16px">
          <button class="btn ${liked ? "btn-soft" : "btn-ghost"}" style="padding:6px 12px;font-size:12px" onclick="toggleLike(${p.id})">♥ ${p.likes.length}</button>
          <button class="btn btn-ghost" style="padding:6px 12px;font-size:12px">💬 ${p.comments.length}</button>
          <button class="btn btn-ghost" style="padding:6px 12px;font-size:12px" onclick="sharePost(${p.id})">مشاركة</button>
        </div>
      </article>`;
  }

  function publishPost(e) {
    e.preventDefault();
    const me = currentUser();
    if (!me) return setView("auth");
    const text = document.getElementById("post-input").value.trim();
    if (!text || text.length > 500) return;
    const now = Date.now();
    const post = { id: uid(), userId: me.id, content: text, likes: [], comments: [], createdAt: now };
    db.posts.unshift(post);
    db.postLogs.push({ userId: me.id, createdAt: now });
    save(); toast("تم نشر البوست"); render();
  }

  function deletePost(id) { db.posts = db.posts.filter((p) => p.id !== id); save(); toast("تم حذف البوست"); render(); }
  function toggleLike(id) {
    const me = currentUser();
    if (!me) return setView("auth");
    const p = db.posts.find((x) => x.id === id);
    if (!p) return;
    const idx = p.likes.indexOf(me.id);
    if (idx >= 0) p.likes.splice(idx, 1);
    else p.likes.push(me.id);
    save(); render();
  }
  function sharePost(id) {
    navigator.clipboard?.writeText(`${location.origin}${location.pathname}#post-${id}`).catch(() => {});
    toast("تم نسخ رابط البوست");
  }

  function renderProfile() {
    const u = getUser(ui.profileUserId);
    if (!u) return `<div class="card">المستخدم غير موجود</div>`;
    const userPosts = db.posts.filter((p) => p.userId === u.id);
    return `
      <div class="stack">
        <div class="card">
          <div class="row" style="gap:16px">
            ${avatarHtml(u, "av-lg")}
            <div>
              <div class="row"><h2>${esc(u.username)}</h2>${badgeHtml(u)}</div>
              ${u.bio ? `<p style="margin:6px 0 0;font-size:14px">${esc(u.bio)}</p>` : ""}
            </div>
          </div>
        </div>
        ${userPosts.map(renderPostCard).join("") || `<div class="card muted" style="text-align:center">لا توجد بوستات.</div>`}
      </div>`;
  }

  function renderChat() {
    return `<div class="card" style="text-align:center; padding: 40px;"><h3>المحادثات</h3><div class="muted">لا توجد محادثات نشطة حالياً.</div></div>`;
  }

  function renderNotifications() {
    return `<div class="card"><h3>الإشعارات</h3><div class="muted">لا توجد إشعارات جديدة.</div></div>`;
  }

  function renderAdmin() {
    return `<div class="card"><h3>لوحة الإدارة</h3><div class="muted">مرحباً بك في لوحة الإدارة.</div></div>`;
  }

  document.querySelectorAll(".theme-icon").forEach((el) => { el.textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "☀️" : "🌙"; });
  render();
  </script>
</body>
</html>
