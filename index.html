<!doctype html>
<html lang="ar" dir="rtl" data-theme="light" data-lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بحر — منصة تواصل اجتماعي نصية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f9fc;
      --surface: #ffffff;
      --surface-soft: #f8fbfe;
      --surface-tint: #edf5fc;
      --border: #dce7f2;
      --ink: #0d2238;
      --muted: #5b748b;
      --blue: #0d63a5;
      --blue-hover: #0a4f85;
      --teal: #0e8a8a;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
    }
    [data-theme="dark"] {
      --bg: #0b131e;
      --surface: #131f30;
      --surface-soft: #18263a;
      --surface-tint: #1e314d;
      --border: #233754;
      --ink: #f0f4f8;
      --muted: #94a3b8;
      --blue: #38bdf8;
      --blue-hover: #7dd3fc;
      --teal: #2dd4bf;
      --danger: #f87171;
      --danger-bg: #451a03;
    }
    [data-lang="en"] { direction: ltr; font-family: system-ui, -apple-system, sans-serif; }
    
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      transition: background 0.2s, color 0.2s;
    }
    h1, h2, h3, .brand { font-family: "Readex Pro", "IBM Plex Sans Arabic", sans-serif; margin: 0; }
    button, input, textarea, select { font-family: inherit; }
    button { cursor: pointer; }
    .tabular { font-variant-numeric: tabular-nums; }
    .container { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

    header {
      position: sticky; top: 0; z-index: 30;
      background: var(--surface);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
    }
    .topbar {
      height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 14px;
    }
    .brand-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: none; border: none; color: var(--ink); font-size: 19px; font-weight: 700;
      white-space: nowrap;
    }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 10px; background: var(--blue); color: #fff;
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .brand-mark svg { width: 18px; height: 18px; fill: currentColor; }
    
    nav { display: flex; align-items: center; gap: 14px; overflow-x: auto; }
    .nav-link {
      background: none; border: none; border-bottom: 2px solid transparent;
      padding: 6px 2px; font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap;
    }
    .nav-link.active { color: var(--blue); border-bottom-color: var(--blue); }

    .header-search {
      position: relative; width: 200px; max-width: 32vw;
    }
    .header-search input {
      width: 100%; padding: 7px 32px 7px 12px; font-size: 13px; color: var(--ink);
      background: var(--surface-soft); border: 1px solid var(--border); border-radius: 20px;
      outline: none;
    }
    [data-lang="en"] .header-search input { padding: 7px 12px 7px 32px; }
    .header-search input:focus { border-color: var(--blue); }
    .header-search svg {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px; fill: var(--muted); pointer-events: none;
    }
    [data-lang="en"] .header-search svg { right: auto; left: 10px; }

    main { padding: 26px 0 60px; }
    .grid-2 { display: grid; grid-template-columns: 1fr; gap: 22px; align-items: start; }
    @media (min-width: 960px) { .grid-2 { grid-template-columns: 2fr 1fr; } }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    }
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 16px; border-radius: 11px; border: 1px solid transparent;
      font-size: 13px; font-weight: 600; white-space: nowrap; transition: 0.15s;
    }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-soft { background: var(--surface-tint); color: var(--blue); }
    .btn-ghost { background: var(--surface-soft); color: var(--ink); border: 1px solid var(--border); }
    .btn-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .input, textarea, select {
      width: 100%; padding: 10px 13px; font-size: 14px; color: var(--ink);
      background: var(--surface-soft); border: 1px solid var(--border); border-radius: 11px;
      outline: none;
    }
    .input:focus, textarea:focus, select:focus { border-color: var(--blue); }

    .avatar {
      border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-weight: 700; color: #fff; user-select: none; overflow: hidden;
      object-fit: cover;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .av-xs { width: 28px; height: 28px; font-size: 11px; }
    .av-sm { width: 36px; height: 36px; font-size: 13px; }
    .av-md { width: 44px; height: 44px; font-size: 15px; }
    .av-lg { width: 72px; height: 72px; font-size: 26px; }
    
    .verified {
      width: 16px; height: 16px; border-radius: 9999px; background: var(--blue); color: #fff;
      display: inline-flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0;
    }

    .tabs {
      display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px;
      background: var(--surface-soft); border: 1px solid var(--border); border-radius: 12px;
    }
    .tab-btn {
      background: none; border: none; padding: 7px 14px; border-radius: 9px;
      font-size: 12px; font-weight: 600; color: var(--muted);
    }
    .tab-btn.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

    .muted { color: var(--muted); font-size: 12px; }
    .divider { border-top: 1px solid var(--border); margin: 14px 0; }
    .post-text { font-size: 15.5px; line-height: 1.85; white-space: pre-wrap; word-break: break-word; margin: 14px 0 0; }
    
    .tag-badge {
      display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600;
      background: var(--surface-tint); color: var(--blue); border: 1px solid var(--border);
    }

    .info-chips {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
    }
    .info-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 8px; font-size: 12px;
      background: var(--surface-soft); border: 1px solid var(--border); color: var(--ink);
    }
    .info-chip svg { width: 14px; height: 14px; fill: currentColor; }

    .photo-upload-box {
      display: flex; align-items: center; gap: 14px; padding: 12px;
      background: var(--surface-soft); border: 1px dashed var(--border); border-radius: 12px;
    }

    .dropdown { position: relative; display: inline-block; }
    .menu-btn {
      background: var(--surface-soft); border: 1px solid var(--border); border-radius: 11px;
      padding: 8px 11px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink);
    }
    .menu-btn:hover { background: var(--surface-tint); }
    .menu-btn svg { width: 18px; height: 18px; fill: currentColor; }
    .dropdown-content {
      position: absolute; left: 0; top: 48px; background: var(--surface); min-width: 220px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: 1px solid var(--border);
      border-radius: 12px; z-index: 40; display: none; overflow: hidden;
    }
    [data-lang="en"] .dropdown-content { left: auto; right: 0; }
    .dropdown-content.show { display: block; }
    .dropdown-item {
      width: 100%; text-align: start; background: none; border: none; padding: 11px 16px;
      font-size: 13px; font-weight: 500; color: var(--ink); display: flex; align-items: center; gap: 9px;
    }
    .dropdown-item:hover { background: var(--surface-soft); }
    .dropdown-item.danger { color: var(--danger); }

    .chat-box { display: grid; grid-template-columns: 1fr; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; background: var(--surface); min-height: 520px; }
    @media (min-width: 820px) { .chat-box { grid-template-columns: 300px 1fr; } }
    .chat-list { border-inline-end: 1px solid var(--border); display: flex; flex-direction: column; }
    .chat-thread { display: flex; flex-direction: column; background: var(--surface-soft); }
    .chat-msgs { flex: 1; padding: 16px; overflow-y: auto; max-height: 380px; display: flex; flex-direction: column; gap: 10px; }
    .bubble { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 14px; }
    .bubble.mine { align-self: flex-start; background: var(--blue); color: #fff; }
    [data-lang="en"] .bubble.mine { align-self: flex-end; }
    .bubble.theirs { align-self: flex-end; background: var(--surface); border: 1px solid var(--border); color: var(--ink); }
    [data-lang="en"] .bubble.theirs { align-self: flex-start; }
    
    .toast {
      position: fixed; bottom: 20px; left: 20px; z-index: 60;
      background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 11px; font-size: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3); border: 1px solid var(--border);
    }
    [data-lang="en"] .toast { left: auto; right: 20px; }
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-card { width: 100%; max-width: 470px; background: var(--surface); border-radius: 16px; padding: 20px; border: 1px solid var(--border); color: var(--ink); max-height: 90vh; overflow-y: auto; }
  </style>
</head>
<body onclick="closeAllMenus()">
  <header>
    <div class="container topbar">
      <button class="brand-btn" onclick="goHome()">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </span>
        <span data-i18n="brandName">بحر</span>
      </button>
      <nav id="nav"></nav>
      <div id="auth-actions" class="row"></div>
    </div>
  </header>

  <main class="container" id="app"></main>
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script>
    const STORAGE_KEY = "bahr_standalone_v7";
    const HOUR_MS = 3600000;
    const DAY_MS = 24 * HOUR_MS;
    
    const I18N = {
      ar: {
        brandName: "بحر",

        commentPlaceholder: "اكتب تعليقاً نصياً...",
        postShareSuccess: "تم نسخ رابط البوست",
        profileShareSuccess: "تم نسخ رابط الحساب",
        bahrCharter: "ميثاق بحر",
        bahrCharterText: "بوست نصي واحد كل 24 ساعة (500 حرف) مع تصنيف إلزامي، ومحادثات مؤقتة تُحذف بعد 24 ساعة.",
      },
      en: {
        brandName: "Bahr",
        home: "Home",
        myAccount: "My Account",
        allPosts: "All Posts",
        discover: "Discover",
        chat: "Messages",
        notifications: "Notifications",
        adminPanel: "Admin Panel",
        searchPlaceholder: "Search people or posts...",
        menuAccount: "My Account (Name & Photo)",
        menuPass: "Change Password",
        menuLang: "العربية / English",
        menuTheme: "Toggle Dark/Light Mode",
        menuDelete: "Delete Account",
        menuLogout: "Logout",
        writersInBahr: "Suggested to Follow",
        noWriters: "No suggestions available",
        charCount: "chars",
        remainingToday: "Remaining today",
        publishPost: "Publish Post",
        saveDraft: "Save Draft",
        myDrafts: "Your Drafts:",
        charLimitExceeded: "Limit exceeded",
        charLimitZero: "You have used your daily post quota (24h)",
        charLimitNext: "You can post again after",
        noPostsFeed: "No posts published yet.",
        char500: "Max 500 characters",
        charShare: "Share Profile Link",
        followers: "Follower",
        following: "Following",
        postsCount: "Post",
        follow: "Follow",
        followingState: "Following",
        messageBtn: "Message",
        block: "Block",
        unblock: "Unblock",
        edit: "Edit",
        delete: "Delete",
        report: "Report",
        like: "Like",
        comment: "Comment",
        share: "Share",
        noComments: "No comments yet.",
        commentPlaceholder: "Write a text comment...",
        postShareSuccess: "Post link copied",
        profileShareSuccess: "Profile link copied",
        bahrCharter: "Bahr Charter",
        bahrCharterText: "One text post every 24 hours (500 chars) with required category, and temporary chats deleted after 24 hours.",
      }
    };

    const CATEGORIES = ["تقنية", "خواطر", "طب وصحة", "ريادة أعمال", "كتب"];
    const COUNTRIES = [
      "مصر", "السعودية", "الإمارات", "الأردن", "فلسطين", "لبنان", "سوريا", "العراق",
      "الكويت", "قطر", "البحرين", "عُمان", "اليمن", "المغرب", "الجزائر", "تونس", "ليبيا", "السودان", "أخرى"
    ];

    const LETTER_COLORS = ["#0d63a5", "#0e7490", "#1e40af", "#0f766e", "#0369a1", "#1d4ed8", "#155e75"];

    function initialData() {
      const now = Date.now();
      return {
        settings: {
          registrationOpen: true,
          autoDeleteEnabled: false,
          autoDeleteHours: 24,
        },
        currentUserId: null,
        nextId: 100,
        users: [
          {
            id: 1, username: "admin", password: "BahrAdmin123", role: "admin", verified: true,
            photoData: null, gender: "رجل", birthDate: "1995-01-01", country: "مصر",
            bio: "الحساب الإداري الرسمي لمنصة بحر.",
            dailyPostLimit: 10, autoDeleteMode: "inherit", autoDeleteHours: null, createdAt: now,
            blockedUsers: [], mutedUsers: []
          },
        ],
        follows: [],
        posts: [],
        drafts: [],
        postLogs: [],
        conversations: [],
        reports: [],
        notifications: [],
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch {}
      const fresh = initialData();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
      return fresh;
    }

    let db = loadState();
    let ui = {
      view: "feed",
      feedMode: "home",
      authMode: "login",
      profileUserId: null,
      activeChatId: null,
      adminTab: "users",
      highlightPostId: null,
      openComments: {},
      searchQuery: "",
      filterCategory: "",
      theme: localStorage.getItem("bahr_theme") || "light",
      lang: localStorage.getItem("bahr_lang") || "ar"
    };

    function t(key) {
      return (I18N[ui.lang] && I18N[ui.lang][key]) || I18N["ar"][key] || key;
    }

    function switchLanguage() {
      ui.lang = ui.lang === "ar" ? "en" : "ar";
      localStorage.setItem("bahr_lang", ui.lang);
      document.documentElement.setAttribute("data-lang", ui.lang);
      document.documentElement.setAttribute("dir", ui.lang === "en" ? "ltr" : "rtl");
      render();
    }

    function checkInitialHash() {
      const h = location.hash || "";
      if (h.startsWith("#user-")) {
        const id = Number(h.replace("#user-", ""));
        if (id && db.users.some((u) => u.id === id)) {
          ui.profileUserId = id;
          ui.view = "profile";
        }
      }
    }
    checkInitialHash();

    document.documentElement.setAttribute("data-theme", ui.theme);
    document.documentElement.setAttribute("data-lang", ui.lang);
    document.documentElement.setAttribute("dir", ui.lang === "en" ? "ltr" : "rtl");

    function toggleTheme() {
      ui.theme = ui.theme === "light" ? "dark" : "light";
      localStorage.setItem("bahr_theme", ui.theme);
      document.documentElement.setAttribute("data-theme", ui.theme);
      render();
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      } catch (err) {
        toast("Storage quota exceeded");
      }
    }

    function uid() {
      db.nextId += 1;
      return db.nextId;
    }

    function currentUser() {
      return db.users.find((u) => u.id === db.currentUserId) || null;
    }

    function getUser(id) {
      return db.users.find((u) => u.id === id) || null;
    }

    function cleanupSweep() {
      const now = Date.now();
      const gEnabled = db.settings.autoDeleteEnabled;
      const gHours = db.settings.autoDeleteHours || 24;

      db.posts = db.posts.filter((p) => {
        const author = getUser(p.userId);
        if (!author) return false;
        if (author.autoDeleteMode === "disabled") return true;
        if (author.autoDeleteMode === "enabled") {
          const hrs = author.autoDeleteHours || gHours;
          return now - p.createdAt < hrs * HOUR_MS;
        }
        if (gEnabled) return now - p.createdAt < gHours * HOUR_MS;
        return true;
      });

      db.conversations = db.conversations.filter((c) => now - c.lastMessageAt < DAY_MS);
      db.postLogs = db.postLogs.filter((l) => now - l.createdAt < 2 * DAY_MS);
      save();
    }

    function toast(msg) {
      const root = document.getElementById("toast-root");
      root.innerHTML = `<div class="toast">${esc(msg)}</div>`;
      clearTimeout(window.__toastT);
      window.__toastT = setTimeout(() => { root.innerHTML = ""; }, 3000);
    }

    function relTime(ts) {
      const m = Math.floor((Date.now() - ts) / 60000);
      if (m < 1) return ui.lang === "en" ? "Just now" : "الآن";
      if (m < 60) return ui.lang === "en" ? `${m}m ago` : `منذ ${m} د`;
      const h = Math.floor(m / 60);
      if (h < 24) return ui.lang === "en" ? `${h}h ago` : `منذ ${h} س`;
      return ui.lang === "en" ? `${Math.floor(h / 24)}d ago` : `منذ ${Math.floor(h / 24)} يوم`;
    }

    function remTime(targetTs) {
      const mins = Math.max(1, Math.ceil((targetTs - Date.now()) / 60000));
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return h > 0 ? `${h}h ${m}m` : `${m}m`;
    }

    function compressImageFile(file, callback) {
      if (!file || !file.type.startsWith("image/")) {
        toast("Invalid image file");
        return;
      }
      const reader = new FileReader();
      reader.onload = function (ev) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement("canvas");
          const MAX = 220;
          let w = img.width, h = img.height;
          if (w > h) {
            if (w > MAX) { h = Math.round((h * MAX) / w); w = MAX; }
          } else {
            if (h > MAX) { w = Math.round((w * MAX) / h); h = MAX; }
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL("image/jpeg", 0.8));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function avatarHtml(user, size = "av-md") {
      if (!user) return "";
      if (user.photoData) {
        return `<span class="avatar ${size}"><img src="${user.photoData}" alt="${esc(user.username)}" /></span>`;
      }
      let hash = 0;
      for (let i = 0; i < user.username.length; i++) hash = (hash * 31 + user.username.charCodeAt(i)) >>> 0;
      const color = LETTER_COLORS[hash % LETTER_COLORS.length];
      const letter = (user.username.trim()[0] || "ب").toUpperCase();
      return `<span class="avatar ${size}" style="background:${color}">${esc(letter)}</span>`;
    }

    function badgeHtml(user) {
      return user && user.verified ? `<span class="verified" title="Verified">✓</span>` : "";
    }

    function getQuota(user) {
      const win = Date.now() - DAY_MS;
      const logs = db.postLogs.filter((l) => l.userId === user.id && l.createdAt > win).sort((a, b) => a.createdAt - b.createdAt);
      const limit = Math.max(1, user.dailyPostLimit || 1);
      const remaining = Math.max(0, limit - logs.length);
      return { limit, remaining, nextAt: remaining === 0 && logs[0] ? logs[0].createdAt + DAY_MS : null };
    }

    function suggestUsernames(name) {
      const base = name.trim().replace(/\s+/g, "_").slice(0, 16) || "user";
      const pool = [`${base}_1`, `${base}_bahr`, `${base}_26`, `${base}_vip`, `${base}_${Math.floor(10 + Math.random() * 89)}`];
      return pool.filter((c) => !db.users.some((u) => u.username.toLowerCase() === c.toLowerCase())).slice(0, 4);
    }

    function notifyUser(userId, type, actorId, message, title = "", postId = null) {
      db.notifications.unshift({

      });

    function handleEditPhotoUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      compressImageFile(file, (dataUrl) => {
        window.__editPhotoData = dataUrl;
        const name = document.getElementById("acc-username")?.value || currentUser().username;
        const prev = document.getElementById("edit-photo-preview");
        if (prev) prev.innerHTML = avatarHtml({ username: name, photoData: dataUrl }, "av-md");
      });
    }

    function removeEditPhoto() {
      window.__editPhotoData = null;
      const name = document.getElementById("acc-username")?.value || currentUser().username;
      const prev = document.getElementById("edit-photo-preview");
      if (prev) prev.innerHTML = avatarHtml({ username: name, photoData: null }, "av-md");
    }

    function saveAccountSettings(e) {
      e.preventDefault();
      const me = currentUser();
      if (!me) return;
      const newName = document.getElementById("acc-username").value.trim();
      const newBio = document.getElementById("acc-bio").value.trim().slice(0, 160);
      const newGender = document.getElementById("acc-gender").value;
      const newCountry = document.getElementById("acc-country").value;
      const newBirth = document.getElementById("acc-birth").value;

      if (newName.length < 3) return toast("Name must be at least 3 chars");
      const exists = db.users.some((u) => u.id !== me.id && u.username.toLowerCase() === newName.toLowerCase());
      if (exists) return toast("Username taken");

      me.username = newName;
      me.bio = newBio;
      me.gender = newGender;
      me.country = newCountry;
      me.birthDate = newBirth;
      me.photoData = window.__editPhotoData || null;
      save();
      closeModal();
      toast("Updated successfully");
      render();
    }

    function submitChangePassword(e) {

      save();
      closeModal();
      toast("Password changed successfully");

    function confirmDeleteMyAccount() {
      const me = currentUser();
      const pw = document.getElementById("del-confirm-pw").value;
      if (me.password !== pw) return toast("Incorrect password");
      const myId = me.id;
      db.users = db.users.filter((u) => u.id !== myId);
      db.posts = db.posts.filter((p) => p.userId !== myId);
      db.follows = db.follows.filter((f) => f.followerId !== myId && f.followingId !== myId);
      db.drafts = db.drafts.filter((d) => d.userId !== myId);
      db.currentUserId = null;
      save();
      closeModal();
      ui.view = "auth";
      toast("Account deleted");
      render();

                        ${window.__regPhotoData ? `<button type="button" class="btn btn-ghost" style="padding:6px 10px;font-size:12px" onclick="window.__regPhotoData=null;render()">X</button>` : ""}
                      </div>
                    </div>
                  </div>` : ""}
                <button type="submit" class="btn btn-primary" style="padding:12px;font-size:15px">${ui.authMode === "login" ? (ui.lang === 'en' ? 'Login' : 'دخول') : (ui.lang === 'en' ? 'Create Account' : 'إنشاء حساب جديد')}</button>
              </form>`}
        </div>`;
    }

    function handleRegPhotoUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      compressImageFile(file, (dataUrl) => {
        window.__regPhotoData = dataUrl;
        const prev = document.getElementById("reg-photo-preview");
        const uVal = document.getElementById("auth-u")?.value || "B";
        if (prev) prev.innerHTML = avatarHtml({ username: uVal, photoData: dataUrl }, "av-md");
      });
    }

    function checkUsernameLive(val) {
      const box = document.getElementById("u-suggest");
      if (!box || ui.authMode !== "register") return;
      const trimmed = val.trim();
      if (!window.__regPhotoData) {
        const prev = document.getElementById("reg-photo-preview");
        if (prev) prev.innerHTML = avatarHtml({ username: trimmed || "B", photoData: null }, "av-md");
      }
      if (trimmed.length < 3) { box.innerHTML = ""; return; }
      const taken = db.users.some((u) => u.username.toLowerCase() === trimmed.toLowerCase());
      if (!taken) { box.innerHTML = `<span style="font-size:12px;color:var(--teal)">✓</span>`; return; }
      const sugs = suggestUsernames(trimmed);
      box.innerHTML = `<div style="font-size:12px;color:#b45309;margin-bottom:4px">Taken</div>` +
        sugs.map((s) => `<button type="button" class="btn btn-soft" style="padding:4px 9px;font-size:11px;margin-inline-end:4px" onclick="document.getElementById('auth-u').value='${esc(s)}';checkUsernameLive('${esc(s)}')">${esc(s)}</button>`).join("");
    }

    function submitAuth(e) {
      e.preventDefault();
      const u = document.getElementById("auth-u").value.trim();
      const p = document.getElementById("auth-p").value;
      if (ui.authMode === "login") {
        const found = db.users.find((x) => x.username.toLowerCase() === u.toLowerCase() && x.password === p);
        if (!found) return toast("Invalid credentials");
        db.currentUserId = found.id;
        save();
        if (!ui.profileUserId) ui.view = "feed";
        render();
      } else {
        if (!db.settings.registrationOpen) return toast("Closed");
        if (db.users.some((x) => x.username.toLowerCase() === u.toLowerCase())) {
          checkUsernameLive(u);
          return toast("Username taken");
        }
        const gender = document.getElementById("reg-gender").value;
        const birthDate = document.getElementById("reg-birth").value;
        const country = document.getElementById("reg-country").value;
        if (!gender || !birthDate || !country) return toast("Complete all fields");

        const newUser = {
          id: uid(), username: u, password: p, role: "user", verified: false,
          photoData: window.__regPhotoData || null,
          gender, birthDate, country,
          bio: "", dailyPostLimit: 1,
          autoDeleteMode: "inherit", autoDeleteHours: null, createdAt: Date.now(),
          blockedUsers: [], mutedUsers: []
        };
        db.users.push(newUser);
        
        // متابعة تلقائية للحساب الأساسي الأول (مثل admin أو أول حساب) من تلقاء نفسه
        const primaryTarget = db.users[0] && db.users[0].id !== newUser.id ? db.users[0].id : null;
        if (primaryTarget) {
          db.follows.push({ followerId: newUser.id, followingId: primaryTarget });
        }

        db.currentUserId = newUser.id;
        window.__regPhotoData = null;
        save();
        if (!ui.profileUserId) ui.view = "feed";
        toast("Account created successfully");
        render();
      }
    }

    function logout() {
      db.currentUserId = null;
      save();
      ui.view = "auth";
      toast("Logged out");
      render();
    }

    function renderFeed() {
      const me = currentUser();
      const blocked = me.blockedUsers || [];
      
      const posts = db.posts
        .filter((p) => !blocked.includes(p.userId))
        .sort((a, b) => b.createdAt - a.createdAt);

      const q = getQuota(me);
      const myDrafts = db.drafts.filter((d) => d.userId === me.id);

      const composerHtml = `<div class="card stack">
        <form onsubmit="publishPost(event)">
          <textarea id="post-input" rows="3" maxlength="500" placeholder="${t("char500")}..." oninput="document.getElementById('char-c').textContent=this.value.length"></textarea>
          <div class="row-between" style="margin-top:10px">
            <div class="row">
              <select id="post-cat" class="input" style="width:auto;padding:6px 10px;font-size:12px" required>
                <option value="">--</option>
                ${CATEGORIES.map((c) => `<option value="${c}">${c}</option>`).join("")}
              </select>
              <button type="button" class="btn btn-ghost" style="padding:6px 10px;font-size:12px" onclick="saveAsDraft()">${t("saveDraft")}</button>
            </div>
            <button type="submit" class="btn btn-primary" ${q.remaining <= 0 ? "disabled" : ""}>${t("publishPost")}</button>
          </div>
          <div class="muted tabular" style="margin-top:6px"><span id="char-c">0</span> / 500 · ${t("remainingToday")}: ${q.remaining}</div>
        </form>
        ${myDrafts.length ? `
          <div class="divider" style="margin:8px 0"></div>
          <div class="muted">${t("myDrafts")}</div>
          <div class="stack" style="gap:6px">
            ${myDrafts.map((d) => `
              <div class="row-between" style="background:var(--surface-soft);padding:8px 12px;border-radius:10px">
                <span style="font-size:13px;max-width:65%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><strong>[${d.category}]</strong> ${esc(d.content)}</span>
                <div class="row">
                  <button class="btn btn-soft" style="padding:4px 8px;font-size:11px" onclick="loadDraft(${d.id})">Post</button>
                  <button class="btn btn-danger" style="padding:4px 8px;font-size:11px" onclick="deleteDraft(${d.id})">Del</button>
                </div>
              </div>`).join("")}
          </div>` : ""}
      </div>`;

      // التبويبات بالترتيب: [الصفحة الرئيسية] ، [حسابي] ، [كل البوستات]
      const modeTabs = `<div class="tabs">
        <button class="tab-btn ${ui.feedMode === 'home' ? 'active' : ''}" onclick="ui.feedMode='home';render()">${t("home")}</button>
        <button class="tab-btn" onclick="openProfile(${me.id})">${t("myAccount")}</button>
        <button class="tab-btn ${ui.feedMode === 'all' ? 'active' : ''}" onclick="ui.feedMode='all';render()">${t("allPosts")}</button>
      </div>`;

      // قائمة اقتراح متابعات (المستخدمين الذين لا يتابعهم بعد)
      const followingIds = db.follows.filter((f) => f.followerId === me.id).map((f) => f.followingId);
      const suggestions = db.users.filter((u) => u.id !== me.id && !blocked.includes(u.id) && !followingIds.includes(u.id) && u.role !== 'admin').slice(0, 5);

      return `
        <div class="grid-2">
          <div class="stack">
            ${modeTabs}
            ${q.remaining > 0 ? composerHtml : `<div class="card"><div style="font-size:14px;font-weight:600">${t("charLimitZero")}</div><div class="muted tabular" style="margin-top:4px">${t("charLimitNext")} ${q.nextAt ? remTime(q.nextAt) : "24h"}</div></div>`}
            ${posts.length ? posts.map(renderPostCard).join("") : `<div class="card muted" style="text-align:center">${t("noPostsFeed")}</div>`}
          </div>
          <aside class="stack">
            <div class="card">
              <h3 style="font-size:15px;margin-bottom:12px">${t("writersInBahr")}</h3>
              <div class="stack" style="gap:10px">
                ${suggestions.length ? suggestions.map((u) => {
                  const fc = db.follows.filter((f) => f.followingId === u.id).length;
                  return `<div class="row-between">
                    <button class="brand-btn" style="font-size:13px" onclick="openProfile(${u.id})">
                      ${avatarHtml(u, "av-sm")} <span>${esc(u.username)}</span> ${badgeHtml(u)}
                    </button>
                    <div class="row">
                      <button class="btn btn-primary" style="padding:5px 10px;font-size:11px" onclick="toggleFollow(${u.id})">${t("follow")}</button>
                    </div>
                  </div>`;
                }).join("") : `<div class="muted" style="text-align:center">${t("noWriters")}</div>`}
              </div>
            </div>
            <div class="card muted" style="line-height:1.8">
              <strong style="color:var(--ink);display:block;margin-bottom:4px">${t("bahrCharter")}</strong>
              ${t("bahrCharterText")}
            </div>
          </aside>
        </div>`;
    }

    function getDiscoverHtml() {
      const me = currentUser();
      const blocked = me.blockedUsers || [];
      let posts = db.posts.filter((p) => !blocked.includes(p.userId));

      if (ui.filterCategory) {
        posts = posts.filter((p) => p.category === ui.filterCategory);
      }
      if (ui.searchQuery) {
        const q = ui.searchQuery.toLowerCase();
        posts = posts.filter((p) => p.content.toLowerCase().includes(q) || getUser(p.userId)?.username.toLowerCase().includes(q));
      }

      // البحث عن أشخاص أو بوستات معاً
      const matchingUsers = ui.searchQuery
        ? db.users.filter((u) => !blocked.includes(u.id) && u.username.toLowerCase().includes(ui.searchQuery.toLowerCase()))
        : [];

      let usersHtml = "";
      if (matchingUsers.length) {
        usersHtml = `<div class="card stack" style="gap:10px">
          <div class="muted">Users:</div>
          <div class="row" style="flex-wrap:wrap;gap:12px">
            ${matchingUsers.map((u) => `
              <button class="btn btn-ghost" onclick="openProfile(${u.id})">
                ${avatarHtml(u, "av-xs")} <span>${esc(u.username)}</span> ${badgeHtml(u)}
              </button>`).join("")}
          </div>
        </div>`;
      }

      return usersHtml + (posts.length ? posts.map(renderPostCard).join("") : `<div class="card muted" style="text-align:center">No matches found.</div>`);
    }

    function renderDiscover() {
      return `
        <div class="stack">
          <div class="card row-between">
            <div class="tabs">
              <button class="tab-btn ${!ui.filterCategory ? "active" : ""}" onclick="ui.filterCategory='';render()">All</button>
              ${CATEGORIES.map((c) => `<button class="tab-btn ${ui.filterCategory === c ? "active" : ""}" onclick="ui.filterCategory='${c}';render()">${c}</button>`).join("")}
            </div>
            ${ui.searchQuery ? `<button class="btn btn-ghost" style="padding:5px 10px;font-size:12px" onclick="ui.searchQuery='';render()">Clear</button>` : ""}
          </div>
          <div id="discover-results" class="stack">
            ${getDiscoverHtml()}
          </div>
        </div>`;
    }

    function renderPostCard(p) {
      const author = getUser(p.userId);
      if (!author) return "";
      const me = currentUser();
      const liked = p.likes.includes(me.id);
      const canDel = (me.id === p.userId || me.role === "admin");
      const canEdit = (me.id === p.userId && (Date.now() - p.createdAt < 10 * 60 * 1000));
      const openC = Boolean(ui.openComments[p.id]);

      return `
        <article class="card" style="${ui.highlightPostId === p.id ? "border-color:var(--blue)" : ""}">
          <div class="row-between">
            <button class="brand-btn" style="font-size:14px" onclick="openProfile(${author.id})">
              ${avatarHtml(author, "av-md")}
              <div style="text-align:start">
                <div class="row" style="gap:5px"><span>${esc(author.username)}</span>${badgeHtml(author)}</div>
                <div class="muted tabular">${relTime(p.createdAt)} · <span class="tag-badge">${esc(p.category || "General")}</span></div>
              </div>
            </button>
            <div class="row">
              ${canEdit ? `<button class="btn btn-ghost" style="padding:5px 10px;font-size:11px" onclick="editPostModal(${p.id})">${t("edit")}</button>` : ""}
              ${canDel ? `<button class="btn btn-danger" style="padding:5px 10px;font-size:11px" onclick="deletePost(${p.id})">${t("delete")}</button>` : ""}
              ${me.id !== author.id ? `<button class="btn btn-ghost" style="padding:5px 10px;font-size:11px" onclick="reportPostPrompt(${p.id})">${t("report")}</button>` : ""}
            </div>
          </div>
          <p class="post-text">${esc(p.content)}</p>
          <div class="divider"></div>
          <div class="row" style="gap:12px">
            <button class="btn ${liked ? "btn-soft" : "btn-ghost"}" style="padding:6px 12px;font-size:12px" onclick="toggleLike(${p.id})">♥ ${p.likes.length}</button>
            <button class="btn btn-ghost" style="padding:6px 12px;font-size:12px" onclick="ui.openComments[${p.id}]=!ui.openComments[${p.id}];render()">💬 ${p.comments.length}</button>
            <button class="btn btn-ghost" style="padding:6px 12px;font-size:12px" onclick="sharePost(${p.id})">${t("share")}</button>
          </div>
          ${openC ? `
            <div class="divider"></div>
            <div class="stack" style="gap:8px">
              ${p.comments.map((c) => {
                const cu = getUser(c.userId);
                return `<div style="background:var(--surface-soft);padding:10px;border-radius:10px">
                  <div class="row" style="font-size:12px"><strong>${esc(cu ? cu.username : "User")}</strong>${badgeHtml(cu)}<span class="muted">· ${relTime(c.createdAt)}</span></div>
                  <div style="font-size:13px;margin-top:4px">${esc(c.content)}</div>
                </div>`;
              }).join("") || `<div class="muted">${t("noComments")}</div>`}
              <form class="row" onsubmit="addComment(event, ${p.id})">
                <input id="cm-${p.id}" class="input" maxlength="500" placeholder="${t("commentPlaceholder")}" />
                <button class="btn btn-primary" type="submit">${t("comment")}</button>
              </form>
            </div>` : ""}
        </article>`;
    }

    function saveAsDraft() {
      const text = document.getElementById("post-input").value.trim();
      const cat = document.getElementById("post-cat").value;
      if (!text) return toast("Empty draft");
      if (!cat) return toast("Select category");
      const me = currentUser();
      db.drafts.push({ id: uid(), userId: me.id, content: text, category: cat, createdAt: Date.now() });
      save();
      document.getElementById("post-input").value = "";
      document.getElementById("char-c").textContent = "0";
      toast("Draft saved");
      render();
    }

    function loadDraft(draftId) {
      const d = db.drafts.find((x) => x.id === draftId);
      if (!d) return;
      db.drafts = db.drafts.filter((x) => x.id !== draftId);
      save();
      const me = currentUser();
      const now = Date.now();
      const post = { id: uid(), userId: me.id, content: d.content, category: d.category, likes: [], comments: [], createdAt: now };
      db.posts.unshift(post);
      db.postLogs.push({ userId: me.id, createdAt: now });
      save();
      toast("Draft posted");
      render();
    }

    function deleteDraft(draftId) {
      db.drafts = db.drafts.filter((x) => x.id !== draftId);
      save();
      render();
    }

    function editPostModal(postId) {
      const p = db.posts.find((x) => x.id === postId);
      if (!p) return;
      document.getElementById("modal-root").innerHTML = `
        <div class="modal-backdrop">
          <div class="modal-card stack">
            <h3>Edit Post</h3>
            <textarea id="edit-content" rows="4" maxlength="500">${esc(p.content)}</textarea>
            <div class="row" style="justify-content:flex-end">
              <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
              <button class="btn btn-primary" onclick="confirmEdit(${postId})">Save</button>
            </div>
          </div>
        </div>`;
    }

    function confirmEdit(postId) {
      const p = db.posts.find((x) => x.id === postId);
      const text = document.getElementById("edit-content").value.trim();
      if (!text || text.length > 500) return toast("Invalid text");
      p.content = text;
      save();
      closeModal();
      toast("Updated");
      render();
    }

    function reportPostPrompt(postId) {
      document.getElementById("modal-root").innerHTML = `
        <div class="modal-backdrop">
          <div class="modal-card stack">
            <h3>Report Post</h3>
            <textarea id="rep-post-reason" rows="3" placeholder="Reason..."></textarea>
            <div class="row" style="justify-content:flex-end">
              <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
              <button class="btn btn-danger" onclick="confirmReportPost(${postId})">Send</button>
            </div>
          </div>
        </div>`;
    }

    function confirmReportPost(postId) {
      const me = currentUser();
      const reason = document.getElementById("rep-post-reason").value.trim() || "Violation";
      db.reports.unshift({ id: uid(), reporterId: me.id, postId, reason, status: "open", createdAt: Date.now() });
      save();
      closeModal();
      toast("Reported");
    }

    function publishPost(e) {
      e.preventDefault();
      const me = currentUser();
      const text = document.getElementById("post-input").value.trim();
      const cat = document.getElementById("post-cat").value;
      if (!text || text.length > 500) return;
      if (!cat) return toast("Select category");
      if (getQuota(me).remaining <= 0) return toast("Quota exceeded");
      const now = Date.now();
      const post = { id: uid(), userId: me.id, content: text, category: cat, likes: [], comments: [], createdAt: now };
      db.posts.unshift(post);
      db.postLogs.push({ userId: me.id, createdAt: now });
      db.follows.filter((f) => f.followingId === me.id).forEach((f) => {
        notifyUser(f.followerId, "post", me.id, `New post by ${me.username}`, "", post.id);
      });
      save();
      toast("Published");
      render();
    }

    function deletePost(id) {
      db.posts = db.posts.filter((p) => p.id !== id);
      save();
      toast("Deleted");
      render();
    }

    function toggleLike(id) {
      const me = currentUser();
      const p = db.posts.find((x) => x.id === id);
      if (!p) return;
      const idx = p.likes.indexOf(me.id);
      if (idx >= 0) p.likes.splice(idx, 1);
      else {
        p.likes.push(me.id);
        if (p.userId !== me.id) notifyUser(p.userId, "like", me.id, `${me.username} liked your post`, "", p.id);
      }
      save();
      render();
    }

    function addComment(e, postId) {
      e.preventDefault();
      const me = currentUser();
      const inp = document.getElementById(`cm-${postId}`);
      const text = inp.value.trim();
      if (!text || text.length > 500) return;
      const p = db.posts.find((x) => x.id === postId);
      if (!p) return;
      p.comments.push({ id: uid(), userId: me.id, content: text, createdAt: Date.now() });
      if (p.userId !== me.id) notifyUser(p.userId, "comment", me.id, `${me.username} commented on your post`, "", p.id);
      save();
      render();
    }

    function sharePost(id) {
      const url = `${location.origin}${location.pathname}#post-${id}`;
      navigator.clipboard?.writeText(url).catch(() => {});
      toast(t("postShareSuccess"));
    }

    function shareProfileLink(userId) {
      const url = `${location.origin}${location.pathname}#user-${userId}`;
      navigator.clipboard?.writeText(url).catch(() => {});
      toast(t("profileShareSuccess"));
    }

    function toggleFollow(targetId) {
      const me = currentUser();
      if (targetId === me.id) return;
      const idx = db.follows.findIndex((f) => f.followerId === me.id && f.followingId === targetId);
      if (idx >= 0) db.follows.splice(idx, 1);
      else {
        db.follows.push({ followerId: me.id, followingId: targetId });
        notifyUser(targetId, "follow", me.id, `${me.username} followed you`);
      }
      save();
      render();
    }

    function toggleBlockUser(targetId) {
      const me = currentUser();
      if (!me.blockedUsers) me.blockedUsers = [];
      const idx = me.blockedUsers.indexOf(targetId);
      if (idx >= 0) {
        me.blockedUsers.splice(idx, 1);
        toast("Unblocked");
      } else {
        me.blockedUsers.push(targetId);
        toast("Blocked");
      }
      save();
      render();
    }

    function renderProfile() {
      const u = getUser(ui.profileUserId);
      if (!u) return `<div class="card">User not found</div>`;
      const me = currentUser();
      const isOwn = me.id === u.id;
      const isF = db.follows.some((f) => f.followerId === me.id && f.followingId === u.id);
      const isBlocked = (me.blockedUsers || []).includes(u.id);
      const followers = db.follows.filter((f) => f.followingId === u.id).length;
      const following = db.follows.filter((f) => f.followerId === u.id).length;
      const userPosts = db.posts.filter((p) => p.userId === u.id).sort((a, b) => b.createdAt - a.createdAt);
      const canChat = !isOwn && u.role !== "admin" && me.role !== "admin" && !isBlocked;

      return `
        <div class="stack">
          <div class="card">
            <div class="row-between">
              <div class="row" style="gap:16px;align-items:flex-start">
                ${avatarHtml(u, "av-lg")}
                <div>
                  <div class="row"><h2>${esc(u.username)}</h2>${badgeHtml(u)}</div>
                  ${u.bio ? `<p style="margin:6px 0 0;font-size:14px">${esc(u.bio)}</p>` : ""}
                  <div class="info-chips">
                    ${u.gender ? `<span class="info-chip"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>${esc(u.gender)}</span>` : ""}
                    ${u.country ? `<span class="info-chip"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>${esc(u.country)}</span>` : ""}
                    ${u.birthDate ? `<span class="info-chip tabular"><svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>${esc(u.birthDate)}</span>` : ""}
                  </div>
                  <div class="muted tabular" style="margin-top:10px"><strong>${followers}</strong> ${t("followers")} · <strong>${following}</strong> ${t("following")} · <strong>${userPosts.length}</strong> ${t("postsCount")}</div>
                </div>
              </div>
              <div class="row" style="flex-wrap:wrap">
                <button class="btn btn-soft" onclick="shareProfileLink(${u.id})">
                  <svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                  ${t("charShare")}
                </button>
                ${!isOwn ? `
                  <button class="btn ${isF ? "btn-soft" : "btn-primary"}" onclick="toggleFollow(${u.id})">${isF ? t("followingState") : t("follow")}</button>
                  ${canChat ? `<button class="btn btn-ghost" onclick="startChat(${u.id})">${t("messageBtn")}</button>` : ""}
                  <button class="btn ${isBlocked ? "btn-primary" : "btn-danger"}" onclick="toggleBlockUser(${u.id})">${isBlocked ? t("unblock") : t("block")}</button>
                ` : ""}
              </div>
            </div>
          </div>
          <h3 style="font-size:16px">${t("postsCount")} (${userPosts.length})</h3>
          ${userPosts.map(renderPostCard).join("") || `<div class="card muted" style="text-align:center">${t("noPostsFeed")}</div>`}
        </div>`;
    }

    function startChat(targetId) {
      const me = currentUser();
      const target = getUser(targetId);
      if (me.role === "admin" || target.role === "admin") return toast("Cannot chat with admin");
      const u1 = Math.min(me.id, targetId);
      const u2 = Math.max(me.id, targetId);
      let conv = db.conversations.find((c) => c.user1Id === u1 && c.user2Id === u2);
      if (!conv) {
        conv = { id: uid(), user1Id: u1, user2Id: u2, lastMessageAt: Date.now(), messages: [] };
        db.conversations.unshift(conv);
        save();
      }
      ui.activeChatId = conv.id;
      ui.view = "chat";
      render();
    }

    function renderChat() {
      const me = currentUser();
      if (me.role === "admin") return `<div class="card">Admin account doesn't use direct chat.</div>`;
      const myConvs = db.conversations.filter((c) => c.user1Id === me.id || c.user2Id === me.id)
        .sort((a, b) => b.lastMessageAt - a.lastMessageAt);
      const active = myConvs.find((c) => c.id === ui.activeChatId) || myConvs[0] || null;
      if (active) ui.activeChatId = active.id;
      const other = active ? getUser(active.user1Id === me.id ? active.user2Id : active.user1Id) : null;
      const peers = db.users.filter((u) => u.id !== me.id && u.role !== "admin" && !(me.blockedUsers || []).includes(u.id));

      return `
        <div class="chat-box">
          <aside class="chat-list">
            <div class="row-between" style="padding:14px;border-bottom:1px solid var(--border)">
              <strong style="font-size:15px">${t("chat")}</strong>
              <select class="input" style="width:auto;padding:5px 8px;font-size:12px" onchange="if(this.value) startChat(Number(this.value))">
                <option value="">+ New</option>
                ${peers.map((p) => `<option value="${p.id}">${esc(p.username)}</option>`).join("")}
              </select>
            </div>
            <div>
              ${myConvs.map((c) => {
                const o = getUser(c.user1Id === me.id ? c.user2Id : c.user1Id);
                return `<button onclick="ui.activeChatId=${c.id};render()" style="width:100%;text-align:start;border:none;border-bottom:1px solid var(--border);padding:12px 14px;background:${active && active.id === c.id ? "var(--surface-tint)" : "var(--surface)"}; color:var(--ink)">
                  <div class="row-between"><strong>${esc(o ? o.username : "")}</strong><span class="muted tabular">${c.messages.length}/100</span></div>
                  <div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.messages[c.messages.length - 1]?.content || "New")}</div>
                </button>`;
              }).join("") || `<div class="muted" style="padding:20px;text-align:center">No chats</div>`}
            </div>
          </aside>
          <section class="chat-thread">
            ${!active || !other ? `<div class="muted" style="margin:auto">Select a chat.</div>` : `
              <div class="row-between" style="padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border)">
                <div>
                  <strong>${esc(other.username)}</strong> ${badgeHtml(other)}
                  <div class="muted tabular">${active.messages.length} / 100</div>
                </div>
                <div class="row">
                  <button class="btn btn-danger" onclick="reportChat(${active.id})">${t("report")}</button>
                  <button class="btn btn-ghost" onclick="toggleBlockUser(${other.id})">${t("block")}</button>
                </div>
              </div>
              <div class="chat-msgs">
                ${active.messages.map((m) => `
                  <div class="bubble ${m.senderId === me.id ? "mine" : "theirs"}">
                    <div>${esc(m.content)}</div>
                    <div style="font-size:10px;opacity:0.75;margin-top:3px">${relTime(m.createdAt)}</div>
                  </div>`).join("") || `<div class="muted" style="text-align:center;margin:auto">Start conversation...</div>`}
              </div>
              ${active.messages.length >= 100
                ? `<div class="muted" style="padding:14px;text-align:center;background:var(--surface)">Limit reached</div>`
                : `<form class="row" style="padding:12px;background:var(--surface);border-top:1px solid var(--border)" onsubmit="sendMsg(event, ${active.id})">
                    <input id="msg-in" class="input" maxlength="500" placeholder="Type a message..." />
                    <button class="btn btn-primary" type="submit">Send</button>
                  </form>`}
            `}
          </section>
        </div>`;
    }

    function sendMsg(e, convId) {
      e.preventDefault();
      const me = currentUser();
      const conv = db.conversations.find((c) => c.id === convId);
      if (!conv || conv.messages.length >= 100) return;
      const text = document.getElementById("msg-in").value.trim();
      if (!text || text.length > 500) return;
      const now = Date.now();
      conv.messages.push({ id: uid(), senderId: me.id, content: text, createdAt: now });
      conv.lastMessageAt = now;
      save();
      render();
    }

    function reportChat(convId) {
      const conv = db.conversations.find((c) => c.id === convId);
      if (!conv) return;
      document.getElementById("modal-root").innerHTML = `
        <div class="modal-backdrop">
          <div class="modal-card stack">
            <h3>Report Chat</h3>
            <textarea id="rep-reason" rows="3" maxlength="300" placeholder="Reason..."></textarea>
            <div class="row" style="justify-content:flex-end">
              <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
              <button class="btn btn-danger" onclick="confirmReport(${convId})">Send</button>
            </div>
          </div>
        </div>`;
    }

    function confirmReport(convId) {
      const me = currentUser();
      const conv = db.conversations.find((c) => c.id === convId);
      if (!conv) return closeModal();
      const reason = document.getElementById("rep-reason").value.trim() || "Violation";
      db.reports.unshift({
        id: uid(), reporterId: me.id, conversationId: convId, reason, status: "open",
        snapshot: conv.messages.slice(-15).map((m) => ({ username: getUser(m.senderId)?.username || "User", content: m.content })),
        createdAt: Date.now(),
      });
      save();
      closeModal();
      toast("Reported");
    }

    function closeModal() {
      document.getElementById("modal-root").innerHTML = "";
    }

    function renderNotifications() {
      const me = currentUser();
      const list = db.notifications.filter((n) => n.userId === me.id);
      return `
        <div class="card">
          <div class="row-between" style="margin-bottom:14px">
            <h2>${t("notifications")}</h2>
            <button class="btn btn-soft" onclick="markAllRead()">Read all</button>
          </div>
          <div class="stack" style="gap:10px">
            ${list.map((n) => {
              const actor = n.actorId ? getUser(n.actorId) : null;
              return `<div style="padding:12px;border-radius:12px;background:${n.type === "admin" ? "var(--surface-tint)" : "var(--surface-soft)"}">
                ${n.title ? `<div style="font-size:12px;font-weight:700;color:var(--blue)">${esc(n.title)}</div>` : ""}
                <div style="font-size:14px">${actor && n.type !== "admin" ? `<strong>${esc(actor.username)}</strong> ` : ""}${esc(n.message)}</div>
                <div class="muted">${relTime(n.createdAt)}</div>
              </div>`;
            }).join("") || `<div class="muted" style="text-align:center">No notifications.</div>`}
          </div>
        </div>`;
    }

    function markAllRead() {
      const me = currentUser();
      db.notifications.forEach((n) => { if (n.userId === me.id) n.isRead = true; });
      save();
      render();
    }

    function renderAdmin() {
      const s = db.settings;
      return `
        <div class="stack">
          <div class="card row-between">
            <div>
              <h2>${t("adminPanel")}</h2>
              <div class="muted tabular">Users: ${db.users.length} · Posts: ${db.posts.length}</div>
            </div>
            <div class="tabs">
              <button class="tab-btn ${ui.adminTab === "users" ? "active" : ""}" onclick="ui.adminTab='users';render()">Users</button>
              <button class="tab-btn ${ui.adminTab === "settings" ? "active" : ""}" onclick="ui.adminTab='settings';render()">Settings</button>
              <button class="tab-btn ${ui.adminTab === "mod" ? "active" : ""}" onclick="ui.adminTab='mod';render()">Reports</button>
            </div>
          </div>
          ${ui.adminTab === "users" ? `
            <div class="card stack">
              ${db.users.map((u) => `
                <div class="row-between" style="padding:10px 0;border-bottom:1px solid var(--border)">
                  <div class="row">${avatarHtml(u, "av-sm")} <strong>${esc(u.username)}</strong> ${badgeHtml(u)}</div>
                  <div class="row" style="flex-wrap:wrap">
                    <button class="btn ${u.verified ? "btn-primary" : "btn-soft"}" onclick="adminVerify(${u.id})">Verify</button>
                    ${u.role !== "admin" ? `<button class="btn btn-danger" onclick="adminDeleteUser(${u.id})">Delete</button>` : ""}
                  </div>
                </div>`).join("")}
            </div>` : ""}
          ${ui.adminTab === "settings" ? `
            <div class="card stack">
              <div class="row-between">
                <div><strong>Registration</strong></div>
                <button class="btn ${s.registrationOpen ? "btn-primary" : "btn-danger"}" onclick="db.settings.registrationOpen=!db.settings.registrationOpen;save();render()">${s.registrationOpen ? "Open" : "Closed"}</button>
              </div>
            </div>` : ""}
          ${ui.adminTab === "mod" ? `
            <div class="card stack">
              <h3>Reports (${db.reports.length})</h3>
              ${db.reports.map((r) => `
                <div style="padding:10px;background:var(--surface-soft);border-radius:10px">
                  <div class="row-between"><strong>${esc(r.reason)}</strong><button class="btn btn-soft" style="padding:4px 8px;font-size:11px" onclick="toggleRep(${r.id})">${r.status}</button></div>
                </div>`).join("") || `<div class="muted">No reports.</div>`}
            </div>` : ""}
        </div>`;
    }

    function adminVerify(id) {
      const u = getUser(id); if (!u) return;
      u.verified = !u.verified; save(); render();
    }
    function adminDeleteUser(id) {
      db.users = db.users.filter((u) => u.id !== id);
      db.posts = db.posts.filter((p) => p.userId !== id);
      save(); render();
    }
    function toggleRep(id) {
      const r = db.reports.find((x) => x.id === id);
      if (r) { r.status = r.status === "open" ? "resolved" : "open"; save(); render(); }
    }

    render();
  </script>
</body>
</html>
