  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --surface-tint: #eef6ff;
      --ink: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --blue: #0d63a5;
      --blue-hover: #094b7d;
      --teal: #0f766e;
      --danger: #dc2626;
      --warning-text: #b45309;
    }
    [data-theme="dark"] {
      --bg: #070d16;
      --surface: #0f172a;
      --surface-soft: #162033;
      --surface-tint: #132842;
      --ink: #f8fafc;
      --muted: #94a3b8;
      --border: #1e293b;
      --blue: #38bdf8;
      --blue-hover: #0284c7;
      --teal: #2dd4bf;
      --danger: #f87171;
      --warning-text: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--ink); padding-bottom: 84px;
    }
    a { color: inherit; }
    button, input, textarea, select { font-family: inherit; }
    button { cursor: pointer; }
    .container { max-width: 1040px; margin: 0 auto; padding: 16px; }
    header {
      position: sticky; top: 0; z-index: 40;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 60px; }
    .brand-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: none; border: none; padding: 4px 6px; border-radius: 10px;
      font-weight: 700; font-size: 18px; color: var(--ink);
    }
    .brand-logo-img { width: 32px; height: 32px; border-radius: 9px; object-fit: cover; border: 1px solid var(--border); }
    .header-search {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface-soft); border: 1px solid var(--border);
      border-radius: 99px; padding: 5px 12px; width: 220px;
    }
    @media (max-width: 640px) { .header-search { width: 135px; } }
    .header-search svg { width: 15px; height: 15px; fill: var(--muted); flex-shrink: 0; }
    .header-search input {
      border: none; background: none; color: var(--ink); font-size: 12px; width: 100%; outline: none;
    }
    .bottom-nav {
      position: fixed; bottom: 0; inset-inline: 0; z-index: 45;
      background: var(--surface); border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; padding: 6px 4px;
    }
    .bottom-nav-item {
      background: none; border: none; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 11px; padding: 4px 8px; border-radius: 10px;
    }
    .bottom-nav-item.active { color: var(--blue); font-weight: 700; background: var(--surface-tint); }
    .bottom-nav-item svg { width: 20px; height: 20px; fill: currentColor; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 16px;
    }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .grid-2 { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 860px) { .grid-2 { grid-template-columns: 1.65fr 1fr; } }
    .muted { color: var(--muted); font-size: 12px; }
    .tabular { font-variant-numeric: tabular-nums; }
    .divider { height: 1px; background: var(--border); margin: 12px 0; }
    .input, textarea, select {
      width: 100%; padding: 10px 12px; border-radius: 11px;
      border: 1px solid var(--border); background: var(--surface-soft);
      color: var(--ink); font-size: 14px; outline: none;
    }
    textarea { resize: vertical; }
    .btn {
      border: none; border-radius: 11px; padding: 8px 14px;
      font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: var(--blue-hover); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-soft { background: var(--surface-tint); color: var(--blue); }
    .btn-ghost { background: var(--surface-soft); color: var(--ink); border: 1px solid var(--border); }
    .btn-danger { background: rgba(220, 38, 38, 0.12); color: var(--danger); }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab-btn {
      background: var(--surface-soft); border: 1px solid var(--border);
      color: var(--muted); border-radius: 10px; padding: 7px 12px; font-size: 12px; font-weight: 600;
    }
    .tab-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .avatar {
      border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; overflow: hidden; flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .av-xs { width: 24px; height: 24px; font-size: 11px; }
    .av-sm { width: 34px; height: 34px; font-size: 13px; }
    .av-md { width: 42px; height: 42px; font-size: 16px; }
    .av-lg { width: 68px; height: 68px; font-size: 24px; }
    .verified {
      display: inline-flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--blue); color: #fff; font-size: 10px; font-weight: 700;
    }
    .post-text { margin: 10px 0 0; font-size: 15px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
    .tag-badge {
      display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px;
      background: var(--surface-tint); color: var(--blue); border: 1px solid var(--border); cursor: pointer;
    }
    .tag-badge:hover { opacity: 0.85; }
    .hashtag-link, .mention-link { color: var(--blue); text-decoration: none; font-weight: 600; }
    .hashtag-link:hover, .mention-link:hover { text-decoration: underline; }
    .mention-link { background: var(--surface-tint); padding: 1px 5px; border-radius: 6px; }
    .mention-dropdown {
      position: absolute; z-index: 60; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); max-height: 180px; overflow-y: auto;
      width: 240px; margin-top: 4px;
    }
    .mention-item {
      width: 100%; border: none; background: none; padding: 8px 12px; display: flex; align-items: center; gap: 8px;
      text-align: start; color: var(--ink); font-size: 13px;
    }
    .mention-item:hover { background: var(--surface-tint); }
    .legal-link-btn {
      background: none; border: none; color: var(--blue); font-size: 12px; padding: 0; cursor: pointer; text-decoration: underline;
    }
    .legal-link-btn:hover { color: var(--blue-hover); }
    .stats-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px;
    }
    @media (min-width: 600px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
    .stat-box {
      background: var(--surface-soft); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; text-align: center;
    }
    .stat-num { font-size: 18px; font-weight: 700; color: var(--blue); }
    .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .info-chips {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
    }
    .info-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 8px; font-size: 12px;
      background: var(--surface-soft); border: 1px solid var(--border); color: var(--ink);
    }
    .info-chip svg { width: 14px; height: 14px; fill: currentColor; }
    .photo-upload-box {
      display: flex; align-items: center; gap: 14px; padding: 12px;
      background: var(--surface-soft); border: 1px dashed var(--border); border-radius: 12px;
    }
    .dropdown { position: relative; display: inline-block; }
    .menu-btn {
      background: var(--surface-soft); border: 1px solid var(--border); border-radius: 11px;
      padding: 8px 11px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink);
    }
    .menu-btn:hover { background: var(--surface-tint); }
    .menu-btn svg { width: 18px; height: 18px; fill: currentColor; }
    .dropdown-content {
      position: absolute; left: 0; top: 48px; background: var(--surface); min-width: 240px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: 1px solid var(--border);
      border-radius: 12px; z-index: 50; display: none; overflow: hidden;
    }
    [data-lang="en"] .dropdown-content { left: auto; right: 0; }
    .dropdown-content.show { display: block; }
    .dropdown-item {
      width: 100%; text-align: start; background: none; border: none; padding: 11px 16px;
      font-size: 13px; font-weight: 500; color: var(--ink); display: flex; align-items: center; gap: 9px;
    }
    .dropdown-item:hover { background: var(--surface-soft); }
    .dropdown-item.danger { color: var(--danger); }
    .chat-box { display: grid; grid-template-columns: 1fr; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; background: var(--surface); min-height: 520px; }
    @media (min-width: 820px) { .chat-box { grid-template-columns: 300px 1fr; } }
    .chat-list { border-inline-end: 1px solid var(--border); display: flex; flex-direction: column; }
    .chat-thread { display: flex; flex-direction: column; background: var(--surface-soft); }
    .chat-msgs { flex: 1; padding: 16px; overflow-y: auto; max-height: 380px; display: flex; flex-direction: column; gap: 10px; }
    .bubble { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 14px; }
    .bubble.mine { align-self: flex-start; background: var(--blue); color: #fff; }
    [data-lang="en"] .bubble.mine { align-self: flex-end; }
    .bubble.theirs { align-self: flex-end; background: var(--surface); border: 1px solid var(--border); color: var(--ink); }
    [data-lang="en"] .bubble.theirs { align-self: flex-start; }
    .toast {
      position: fixed; bottom: 85px; left: 20px; z-index: 90;
      background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 11px; font-size: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3); border: 1px solid var(--border);
    }
    [data-lang="en"] .toast { left: auto; right: 20px; }
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,0.65);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-card { width: 100%; max-width: 520px; background: var(--surface); border-radius: 16px; padding: 22px; border: 1px solid var(--border); color: var(--ink); max-height: 90vh; overflow-y: auto; }
    .quote-preview-img { width: 100%; border-radius: 12px; border: 1px solid var(--border); display: block; box-shadow: 0 10px 25px rgba(0,0,0,0.25); }
  </style>

    function compressImageFile(file, callback) {
      if (!file || !file.type.startsWith("image/")) {
        toast("Invalid image file");
        return;
      }
      const reader = new FileReader();
      reader.onload = function (ev) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement("canvas");
          const MAX = 220;
          let w = img.width, h = img.height;
          if (w > h) {
            if (w > MAX) { h = Math.round((h * MAX) / w); w = MAX; }
          } else {
            if (h > MAX) { w = Math.round((w * MAX) / h); h = MAX; }
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL("image/jpeg", 0.75));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function esc(str) {
      return String(str || "").replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    function formatRichText(text) {
      let safe = esc(text);
      safe = safe.replace(/(#[a-zA-Z0-9_\u0600-\u06FF]+)/g, '<a href="javascript:void(0)" class="hashtag-link" onclick="filterByTag(\'$1\')">$1</a>');
      safe = safe.replace(/@([a-zA-Z0-9_]{3,24})/g, (match, uname) => {
        const target = getUserByUsername(uname);
        if (target && !target.disabled) {
          return `<a href="javascript:void(0)" class="mention-link" onclick="openProfileByUsername('${esc(target.username)}')">@${esc(target.username)}</a>`;
        }
        return match;
      });
      return safe;
    }

    async function processMentionsAndNotify(text, actor, postId) {
      const regex = /@([a-zA-Z0-9_]{3,24})/g;
      const notifiedIds = new Set();
      let match;
      while ((match = regex.exec(text)) !== null) {
        const uname = match[1];
        const target = getUserByUsername(uname);
        if (target && !target.disabled && target.id !== actor.id && !notifiedIds.has(target.id)) {
          notifiedIds.add(target.id);
          await notifyUser(target.id, "mention", actor.id, `قام ${getDisplayName(actor)} بذكرك في منشور أو تعليق (@${actor.username})`, "", postId);
        }
      }
    }

    function handleMentionAutocomplete(inputEl, dropdownId) {
      const box = document.getElementById(dropdownId);
      if (!box) return;
      const val = inputEl.value;
      const cursorPos = inputEl.selectionStart;
      const textBefore = val.slice(0, cursorPos);
      const atMatch = textBefore.match(/@([a-zA-Z0-9_]*)$/);

      if (!atMatch) {
        box.style.display = "none";
        return;
      }

      const query = atMatch[1].toLowerCase();
      const me = currentUser();
      const candidates = db.users
        .filter((u) => (!me || u.id !== me.id) && !u.disabled && (u.username.toLowerCase().includes(query) || getDisplayName(u).toLowerCase().includes(query)))
        .slice(0, 5);

      if (!candidates.length) {
        box.style.display = "none";
        return;
      }

      box.innerHTML = candidates.map((u) => `
        <button type="button" class="mention-item" onclick="insertMention('${inputEl.id}', '${dropdownId}', '${esc(u.username)}')">
          ${avatarHtml(u, "av-xs")}
          <div>

            <div class="muted" style="font-size:11px">@${esc(u.username)}</div>

        </button>`).join("");

    }

      inputEl.focus();

    function drawQuoteCardCanvas(content, authorName, authorHandle, isVerified, category) {
      const canvas = document.getElementById("quote-canvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const W = canvas.width;
      const H = canvas.height;

      const grad = ctx.createLinearGradient(0, 0, W, H);
      grad.addColorStop(0, "#091526");
      grad.addColorStop(0.5, "#0f2744");
      grad.addColorStop(1, "#081220");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      const radial = ctx.createRadialGradient(W * 0.85, H * 0.15, 20, W * 0.85, H * 0.15, 320);
      radial.addColorStop(0, "rgba(56, 189, 248, 0.18)");
      radial.addColorStop(1, "rgba(56, 189, 248, 0)");
      ctx.fillStyle = radial;
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = "rgba(56, 189, 248, 0.35)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(28, 28, W - 56, H - 56, 24);
      ctx.stroke();

      ctx.fillStyle = "rgba(56, 189, 248, 0.25)";
      ctx.font = "bold 90px Georgia, serif";
      ctx.textAlign = "right";
      ctx.fillText("”", W - 65, 135);

      ctx.fillStyle = "#f8fafc";
      ctx.font = "600 30px 'IBM Plex Sans Arabic', sans-serif";
      ctx.textAlign = "right";
      ctx.direction = "rtl";

      const maxWidth = W - 140;
      const lineHeight = 48;
      const words = content.split(/\s+/);
      let lines = [];
      let currentLine = "";

      for (let i = 0; i < words.length; i++) {
        const testLine = currentLine + words[i] + " ";
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && i > 0) {
          lines.push(currentLine.trim());
          currentLine = words[i] + " ";
        } else {
          currentLine = testLine;
        }
      }
      lines.push(currentLine.trim());
      if (lines.length > 6) {
        lines = lines.slice(0, 6);
        lines[5] += "...";
      }

      const totalTextHeight = lines.length * lineHeight;
      let startY = (H - totalTextHeight) / 2 + 10;

      lines.forEach((line) => {
        ctx.fillText(line, W - 70, startY);
        startY += lineHeight;
      });

      ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(65, H - 115);
      ctx.lineTo(W - 65, H - 115);
      ctx.stroke();

      ctx.fillStyle = "#38bdf8";
      ctx.font = "bold 24px 'Readex Pro', sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(authorName + (isVerified ? " ✓" : ""), W - 70, H - 72);

      ctx.fillStyle = "#94a3b8";
      ctx.font = "400 18px sans-serif";
      ctx.fillText(authorHandle + (category ? `  •  ${category}` : ""), W - 70, H - 45);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 26px 'Readex Pro', sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("منصة بحر", 70, H - 68);

      ctx.fillStyle = "#38bdf8";
      ctx.font = "400 15px sans-serif";
      ctx.fillText("bahr.social", 70, H - 45);

      const previewImg = document.getElementById("quote-preview");
      if (previewImg) {
        previewImg.src = canvas.toDataURL("image/png");
      }
    }

    function getTrendingHashtags() {
      const now = Date.now();
      const recentPosts = db.posts.filter((p) => {
        const author = getUser(p.userId);
        return author && !author.disabled && (now - p.createdAt <= DAY_MS);
      });

      const counts = {};
      const regex = /(#[a-zA-Z0-9_\u0600-\u06FF]+)/g;
      recentPosts.forEach((p) => {
        const matches = p.content.match(regex);
        if (matches) {
          matches.forEach((tag) => {
            const cleanTag = tag.trim();
            counts[cleanTag] = (counts[cleanTag] || 0) + 1;
          });
        }
      });

      return Object.entries(counts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5)
        .map(([tag, count]) => ({ tag, count }));
    }

    function avatarHtml(user, size = "av-md") {
      if (!user) return "";
      if (user.photoData) {
        return `<span class="avatar ${size}"><img src="${user.photoData}" alt="${esc(user.username)}" /></span>`;
      }
      let hash = 0;
      for (let i = 0; i < user.username.length; i++) hash = (hash * 31 + user.username.charCodeAt(i)) >>> 0;
      const color = LETTER_COLORS[hash % LETTER_COLORS.length];
      const letter = (user.firstName ? user.firstName.trim()[0] : user.username.trim()[0] || "ب").toUpperCase();
      return `<span class="avatar ${size}" style="background:${color}">${esc(letter)}</span>`;
    }

    function badgeHtml(user) {
      return user && user.verified ? `<span class="verified" title="Verified">✓</span>` : "";
    }

    function getQuota(user) {
      const win = Date.now() - DAY_MS;
      const userPostsInWin = db.posts
        .filter((p) => p.userId === user.id && p.createdAt > win)
        .sort((a, b) => a.createdAt - b.createdAt);
      const limit = Math.max(1, user.dailyPostLimit || 1);
      const remaining = Math.max(0, limit - userPostsInWin.length);
      return {
        limit,
        remaining,
        nextAt: remaining === 0 && userPostsInWin[0] ? userPostsInWin[0].createdAt + DAY_MS : null
      };
    }

    function suggestUsernames(name) {
      const base = name.trim().replace(/\s+/g, "_").slice(0, 16) || "user";
      const pool = [`${base}_1`, `${base}_bahr`, `${base}_26`, `${base}_vip`, `${base}_${Math.floor(10 + Math.random() * 89)}`];
      return pool.filter((c) => !db.users.some((u) => u.username.toLowerCase() === c.toLowerCase())).slice(0, 4);
    }

    async function notifyUser(userId, type, actorId, message, title = "", postId = "") {
      try {
        const doc = await awDB.createDocument(
          APPWRITE_CFG.databaseId,
          APPWRITE_CFG.collections.notifications,
          AW_ID.unique(),
          {
            userId: String(userId),
            type: String(type),
            actorId: actorId ? String(actorId) : "",
            postId: postId ? String(postId) : "",
            title: String(title || ""),
            message: String(message),
            isRead: false,
            createdAt: Date.now()
          }
        );
        db.notifications.unshift({
          id: doc.$id,
          userId: doc.userId,
          type: doc.type,
          actorId: doc.actorId || null,
          postId: doc.postId || null,
          title: doc.title || "",
          message: doc.message,
          isRead: Boolean(doc.isRead),
          createdAt: Number(doc.createdAt || Date.now())
        });
      } catch (err) {
        console.error("Notification create error:", err);
      }
    }

    async function submitVerificationRequest(e) {
      e.preventDefault();
      const me = currentUser();
      if (!me) return;
      const fullname = document.getElementById("vr-fullname").value.trim();
      const nationalId = document.getElementById("vr-nationalid").value.trim();
      const address = document.getElementById("vr-address").value.trim();
      const age = document.getElementById("vr-age").value.trim();
      const birthDate = document.getElementById("vr-birth").value.trim();
      const phone = document.getElementById("vr-phone").value.trim();

      try {
        const doc = await awDB.createDocument(
          APPWRITE_CFG.databaseId,
          APPWRITE_CFG.collections.verificationRequests,
          AW_ID.unique(),
          {
            userId: me.id,
            fullname,
            nationalId,
            address,
            age: String(age),
            birthDate,
            phone,
            status: "pending",
            createdAt: Date.now()
          }
        );

        if (!db.verificationRequests) db.verificationRequests = [];
        db.verificationRequests.unshift({
          id: doc.$id,
          userId: me.id,
          fullname,
          nationalId,
          address,
          age,
          birthDate,
          phone,
          status: "pending",
          createdAt: Number(doc.createdAt || Date.now())
        });

        const adminUser = db.users.find((u) => u.role === "admin");
        if (adminUser) {
          await notifyUser(adminUser.id, "admin", me.id, `قام المستخدم ${getDisplayName(me)} بتقديم طلب توثيق حساب جديد (الاسم: ${fullname})`, "طلب توثيق جديد");
        }

        closeModal();
        toast("تم إرسال طلب التوثيق إلى الإدارة بنجاح");
        render();
      } catch (err) {
        toast("تعذر إرسال طلب التوثيق: " + (err.message || ""));
      }
    }

    async function saveAccountSettings(e) {
      e.preventDefault();
      const me = currentUser();
      if (!me) return;
      const newUname = document.getElementById("acc-username").value.trim();
      const newFirst = document.getElementById("acc-first").value.trim();
      const newSecond = document.getElementById("acc-second").value.trim();
      const newBio = document.getElementById("acc-bio").value.trim().slice(0, 160);
      const newGender = document.getElementById("acc-gender").value;
      const newCountry = document.getElementById("acc-country").value;
      const newBirth = document.getElementById("acc-birth").value;

      if (newUname.length < 3) return toast("اسم المستخدم يجب ألا يقل عن 3 أحرف");
      const exists = db.users.some((u) => u.id !== me.id && u.username.toLowerCase() === newUname.toLowerCase());
      if (exists) return toast("اسم المستخدم مستخدم مسبقاً");

      try {
        const photoVal = window.__editPhotoData || "";
        await awDB.updateDocument(
          APPWRITE_CFG.databaseId,
          APPWRITE_CFG.collections.users,
          me.id,
          {
            username: newUname,
            firstName: newFirst,
            secondName: newSecond,
            bio: newBio,
            gender: newGender,
            country: newCountry,
            birthDate: newBirth,
            photoData: photoVal
          }
        );

        me.username = newUname;
        me.firstName = newFirst;
        me.secondName = newSecond;
        me.bio = newBio;
        me.gender = newGender;
        me.country = newCountry;
        me.birthDate = newBirth;
        me.photoData = window.__editPhotoData || null;
        if (ui.profileUsername === me.username || ui.view === "profile") {
          ui.profileUsername = newUname;
        }
        closeModal();
        toast("تم التحديث بنجاح");
        render();
      } catch (err) {
        toast("تعذر حفظ الإعدادات: " + (err.message || ""));

    function checkUsernameLive(val) {
      const box = document.getElementById("u-suggest");
      if (!box || ui.authMode !== "register") return;
      const trimmed = val.trim().toLowerCase();
      if (!window.__regPhotoData) {
        const prev = document.getElementById("reg-photo-preview");
        const fVal = document.getElementById("reg-first")?.value || trimmed;
        if (prev) prev.innerHTML = avatarHtml({ username: trimmed || "B", firstName: fVal, photoData: null }, "av-md");
      }
      if (trimmed.length < 3) { box.innerHTML = ""; return; }
      const taken = db.users.some((u) => u.username.toLowerCase() === trimmed);
      if (!taken) { box.innerHTML = `<span style="font-size:12px;color:var(--teal)">✓ اسم المستخدم متاح</span>`; return; }
      const sugs = suggestUsernames(trimmed);
      box.innerHTML = `<div style="font-size:12px;color:#b45309;margin-bottom:4px">اسم المستخدم مستخدم مسبقاً، اقتراحات:</div>` +

    }

    async function submitAuth(e) {
      e.preventDefault();
      const u = document.getElementById("auth-u").value.trim();
      const p = document.getElementById("auth-p").value;

      if (ui.authMode === "login") {
        try {
          try { await awAccount.deleteSession("current"); } catch {}
          await awAccount.createEmailPasswordSession(toAuthEmail(u), p);
          await syncAllFromAppwrite();
          const me = currentUser();
          if (!me) {
            toast("تم تسجيل الدخول ولكن ملف المستخدم غير موجود في قاعدة البيانات");
            return;
          }
          if (me.disabled) {
            try { await awAccount.deleteSession("current"); } catch {}
            db.currentUserId = null;
            render();
            return toast("عذراً، هذا الحساب معطل من قِبل الإدارة");
          }
          ui.view = ui.profileUsername ? "profile" : "feed";
          ui.feedMode = "home";
          toast("تم تسجيل الدخول بنجاح");
          render();
        } catch (err) {
          toast("بيانات تسجيل الدخول غير صحيحة أو الحساب غير موجود");
        }
      } else {
        if (!db.settings.registrationOpen) return toast("التسجيل مغلق حالياً");
        if (db.users.some((x) => x.username.toLowerCase() === u.toLowerCase())) {
          checkUsernameLive(u);
          return toast("اسم المستخدم مستخدم مسبقاً");
        }
        const firstName = document.getElementById("reg-first").value.trim();
        const secondName = document.getElementById("reg-second").value.trim();
        const gender = document.getElementById("reg-gender").value;
        const birthDate = document.getElementById("reg-birth").value;
        const country = document.getElementById("reg-country").value;
        if (!firstName || !gender || !birthDate || !country) return toast("يرجى إكمال كافة الحقول المطلوبة");

        try {
          try { await awAccount.deleteSession("current"); } catch {}
          const authUser = await awAccount.create(AW_ID.unique(), toAuthEmail(u), p, `${firstName} ${secondName}`.trim() || u);
          await awAccount.createEmailPasswordSession(toAuthEmail(u), p);

          const isFirstAdmin = u.toLowerCase() === APPWRITE_CFG.adminUsername.toLowerCase();
          const userDoc = await awDB.createDocument(
            APPWRITE_CFG.databaseId,
            APPWRITE_CFG.collections.users,
            AW_ID.unique(),
            {
              authUserId: authUser.$id,
              username: u,
              firstName,
              secondName: secondName || "",
              role: isFirstAdmin ? "admin" : "user",
              verified: isFirstAdmin,
              disabled: false,
              photoData: window.__regPhotoData || (isFirstAdmin ? LOGO_URL : ""),
              gender,
              birthDate,
              country,
              bio: "",
              dailyPostLimit: isFirstAdmin ? 10 : 1,
              autoDeleteMode: "inherit",
              autoDeleteHours: 0,
              blockedUsers: []
            }
          );

          await syncAllFromAppwrite();
          const newUser = getUser(userDoc.$id);
          const adminUser = db.users.find((x) => x.username.toLowerCase() === APPWRITE_CFG.adminUsername.toLowerCase());
          if (adminUser && newUser && adminUser.id !== newUser.id) {
            const alreadyFollows = db.follows.some((f) => f.followerId === newUser.id && f.followingId === adminUser.id);
            if (!alreadyFollows) {
              const fDoc = await awDB.createDocument(
                APPWRITE_CFG.databaseId,
                APPWRITE_CFG.collections.follows,
                AW_ID.unique(),
                {
                  followerId: newUser.id,
                  followingId: adminUser.id,
                  createdAt: Date.now()
                }
              );
              db.follows.push({ id: fDoc.$id, followerId: newUser.id, followingId: adminUser.id, createdAt: Number(fDoc.createdAt || Date.now()) });
              await notifyUser(adminUser.id, "follow", newUser.id, `قام ${getDisplayName(newUser)} بمتابعتك تلقائياً عند إنشاء حسابه`);
            }
          }

          db.currentUserId = userDoc.$id;
          ui.view = ui.profileUsername ? "profile" : "feed";
          ui.feedMode = "home";
          window.__regPhotoData = null;
          toast("تم إنشاء الحساب وتسجيل الدخول بنجاح");
          render();
        } catch (err) {
          toast("تعذر إنشاء الحساب: " + (err.message || ""));
        }
      }
    }

    function handleCatSelectChange(val) {
      const customInp = document.getElementById("post-cat-custom");
      if (!customInp) return;
      if (val === "other") {
        customInp.style.display = "block";
        customInp.focus();
      } else {
        customInp.style.display = "none";
        customInp.value = "";
      }
    }

    function getDiscoverHtml() {
      const me = currentUser();
      const blocked = me ? (me.blockedUsers || []) : [];
      let posts = db.posts.filter((p) => {
        const author = getUser(p.userId);
        return author && !author.disabled && !blocked.includes(p.userId);
      });

      if (ui.filterCategory) {
        posts = posts.filter((p) => p.category === ui.filterCategory);
      }
      if (ui.filterTag) {
        const tagLower = ui.filterTag.toLowerCase();
        posts = posts.filter((p) => p.content.toLowerCase().includes(tagLower));
      }
      if (ui.searchQuery && !ui.searchQuery.startsWith("#")) {
        const q = ui.searchQuery.toLowerCase();
        posts = posts.filter((p) => p.content.toLowerCase().includes(q) || getDisplayName(getUser(p.userId)).toLowerCase().includes(q));
      }

      const matchingUsers = ui.searchQuery && !ui.searchQuery.startsWith("#")
        ? db.users.filter((u) => !u.disabled && !blocked.includes(u.id) && (u.username.toLowerCase().includes(ui.searchQuery.toLowerCase()) || getDisplayName(u).toLowerCase().includes(ui.searchQuery.toLowerCase())))
        : [];

      let usersHtml = "";
      if (matchingUsers.length) {
        usersHtml = `<div class="card stack" style="gap:10px">
          <div class="muted">مستخدمون مطابقون:</div>
          <div class="row" style="flex-wrap:wrap;gap:12px">
            ${matchingUsers.map((u) => `
              <button class="btn btn-ghost" onclick="openProfileByUsername('${esc(u.username)}')">
                ${avatarHtml(u, "av-xs")} <span>${esc(getDisplayName(u))}</span> ${badgeHtml(u)}
              </button>`).join("")}
          </div>
        </div>`;
      }

      const activeFilterInfo = ui.filterTag ? `<div class="card" style="background:var(--surface-tint);padding:10px 14px"><div class="row-between"><span>عرض المنشورات المرتبطة بالوسم: <strong>${esc(ui.filterTag)}</strong></span><button class="btn btn-ghost" style="padding:4px 8px;font-size:11px" onclick="ui.filterTag='';render()">إلغاء الوسم</button></div></div>` : "";

      return activeFilterInfo + usersHtml + (posts.length ? posts.map(renderPostCard).join("") : `<div class="card muted" style="text-align:center">لا توجد نتائج مطابقة لبحثك.</div>`);
    }

    function renderDiscover() {
      return `
        <div class="stack">
          <div class="card row-between">
            <div class="tabs">
              <button class="tab-btn ${!ui.filterCategory && !ui.filterTag ? "active" : ""}" onclick="ui.filterCategory='';ui.filterTag='';render()">الكل</button>
              ${DEFAULT_CATEGORIES.map((c) => `<button class="tab-btn ${ui.filterCategory === c ? "active" : ""}" onclick="ui.filterCategory='${c}';render()">${c}</button>`).join("")}
            </div>
            ${ui.searchQuery || ui.filterTag ? `<button class="btn btn-ghost" style="padding:5px 10px;font-size:12px" onclick="ui.searchQuery='';ui.filterTag='';render()">إلغاء الفلترة</button>` : ""}
          </div>
          <div id="discover-results" class="stack">
            ${getDiscoverHtml()}
          </div>
        </div>`;
    }

    function renderPostCard(p) {
      const author = getUser(p.userId);
      if (!author || author.disabled) return "";
      const me = currentUser();
      const liked = me ? p.likes.includes(me.id) : false;
      const canDel = Boolean(me && (me.id === p.userId || me.role === "admin"));
      const canEdit = Boolean(me && me.id === p.userId && db.settings.allowPostEdits && (Date.now() - p.createdAt < 30 * 60 * 1000));
      const openC = Boolean(ui.openComments[p.id]);

      return `
        <article class="card" style="${ui.highlightPostId === p.id ? "border-color:var(--blue)" : ""}">
          <div class="row-between">
            <button class="brand-btn" style="font-size:14px" onclick="openProfileByUsername('${esc(author.username)}')">
              ${avatarHtml(author, "av-md")}
              <div style="text-align:start">
                <div class="row" style="gap:5px"><span>${esc(getDisplayName(author))}</span>${badgeHtml(author)}</div>
                <div class="muted tabular">${relTime(p.createdAt)}${p.category ? ` · <span class="tag-badge" onclick="ui.filterCategory='${esc(p.category)}';setView('discover')">${esc(p.category)}</span>` : ""}</div>
              </div>
            </button>
            <div class="row">
              ${canEdit ? `<button class="btn btn-ghost" style="padding:5px 10px;font-size:11px" onclick="editPostModal('${esc(p.id)}')">${t("edit")}</button>` : ""}
              ${canDel ? `<button class="btn btn-danger" style="padding:5px 10px;font-size:11px" onclick="deletePost('${esc(p.id)}')">${t("delete")}</button>` : ""}
              ${(!me || me.id !== author.id) ? `<button class="btn btn-ghost" style="padding:5px 10px;font-size:11px" onclick="reportPostPrompt('${esc(p.id)}')">${t("report")}</button>` : ""}
            </div>
          </div>
          <p class="post-text">${formatRichText(p.content)}</p>
          <div class="divider"></div>
          <div class="row" style="gap:8px;flex-wrap:wrap">
            <button class="btn ${liked ? "btn-soft" : "btn-ghost"}" style="padding:6px 12px;font-size:12px" onclick="toggleLike('${esc(p.id)}')">♥ ${p.likes.length}</button>
            <button class="btn btn-ghost" style="padding:6px 12px;font-size:12px" onclick="ui.openComments['${esc(p.id)}']=!ui.openComments['${esc(p.id)}'];render()">💬 ${p.comments.length}</button>
            <button class="btn btn-soft" style="padding:6px 12px;font-size:12px" onclick="openQuoteCardModal('${esc(p.id)}')">🖼️ ${t("quoteCard")}</button>
            <button class="btn btn-ghost" style="padding:6px 12px;font-size:12px" onclick="sharePost('${esc(p.id)}')">${t("share")}</button>
          </div>
          ${openC ? `
            <div class="divider"></div>
            <div class="stack" style="gap:8px">
              ${p.comments.map((c) => {
                const cu = getUser(c.userId);
                return `<div style="background:var(--surface-soft);padding:10px;border-radius:10px">
                  <div class="row" style="font-size:12px"><strong>${esc(cu ? getDisplayName(cu) : "مستخدم")}</strong>${badgeHtml(cu)}<span class="muted">· ${relTime(c.createdAt)}</span></div>
                  <div style="font-size:13px;margin-top:4px">${formatRichText(c.content)}</div>
                </div>`;
              }).join("") || `<div class="muted">${t("noComments")}</div>`}
              <form class="row" style="position:relative" onsubmit="addComment(event, '${esc(p.id)}')">
                <div style="flex:1;position:relative">
                  <input id="cm-${esc(p.id)}" class="input" maxlength="500" placeholder="${t("commentPlaceholder")}" oninput="handleMentionAutocomplete(this, 'cm-mention-box-${esc(p.id)}')" />
                  <div id="cm-mention-box-${esc(p.id)}" class="mention-dropdown" style="display:none;bottom:44px;top:auto"></div>
                </div>
                <button class="btn btn-primary" type="submit">${t("comment")}</button>

    function saveAsDraft() {
      if (!requireAuth()) return;
      const text = document.getElementById("post-input").value.trim();
      const catSelect = document.getElementById("post-cat").value;
      const catCustom = document.getElementById("post-cat-custom")?.value.trim();
      const cat = catSelect === "other" ? (catCustom || "عام") : catSelect;

      if (!text) return toast("المسودة فارغة");
      const me = currentUser();
      db.drafts.push({ id: AW_ID.unique(), userId: me.id, content: text, category: cat, createdAt: Date.now() });
      save();
      document.getElementById("post-input").value = "";
      document.getElementById("char-c").textContent = "0";
      toast("تم حفظ المسودة بنجاح");
      render();
    }

    async function loadDraft(draftId) {
      if (!requireAuth()) return;
      const d = db.drafts.find((x) => x.id === draftId);
      if (!d) return;
      db.drafts = db.drafts.filter((x) => x.id !== draftId);
      save();
      const me = currentUser();
      const now = Date.now();
      try {
        const doc = await awDB.createDocument(
          APPWRITE_CFG.databaseId,
          APPWRITE_CFG.collections.posts,
          AW_ID.unique(),
          {
            userId: me.id,
            content: d.content,
            category: d.category || "",
            likes: [],
            commentsJson: [],
            createdAt: now
          }
        );
        const post = {
          id: doc.$id,
          userId: me.id,
          content: d.content,
          category: d.category || "",
          likes: [],
          comments: [],
          createdAt: now
        };
        db.posts.unshift(post);
        await processMentionsAndNotify(d.content, me, post.id);
        toast("تم نشر المسودة");
        render();
      } catch (err) {
        toast("تعذر نشر المسودة");
      }
    }

    function deleteDraft(draftId) {
      if (!requireAuth()) return;
      db.drafts = db.drafts.filter((x) => x.id !== draftId);
      save();
      render();
    }

    function editPostModal(postId) {

      const p = db.posts.find((x) => x.id === postId);

      document.getElementById("modal-root").innerHTML = `
        <div class="modal-backdrop">
          <div class="modal-card stack">
            <h3>تعديل البوست</h3>
            <textarea id="edit-content" rows="4" maxlength="500">${esc(p.content)}</textarea>
            <div class="row" style="justify-content:flex-end">
              <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
              <button class="btn btn-primary" onclick="confirmEdit('${esc(postId)}')">حفظ</button>
            </div>
          </div>
        </div>`;
    }

    async function confirmEdit(postId) {
      const p = db.posts.find((x) => x.id === postId);
      const text = document.getElementById("edit-content").value.trim();
      if (!text || text.length > 500) return toast("النص غير صالح");

        await awDB.updateDocument(

          APPWRITE_CFG.collections.posts,

    function reportPostPrompt(postId) {
      if (!requireAuth("سجّل دخولك أولاً لتقديم بلاغ على المنشور.")) return;
      document.getElementById("modal-root").innerHTML = `
        <div class="modal-backdrop">

            <textarea id="rep-post-reason" rows="3" placeholder="سبب الإبلاغ..."></textarea>

    function confirmReportPost(postId) {
      const me = currentUser();
      if (!me) return;
      const reason = document.getElementById("rep-post-reason").value.trim() || "مخالفة";
      db.reports.unshift({ id: AW_ID.unique(), reporterId: me.id, postId, reason, status: "open", createdAt: Date.now() });
      save();
      closeModal();
      toast("تم إرسال البلاغ للإدارة");
    }

    async function publishPost(e) {
      e.preventDefault();
      const me = currentUser();
      if (!me) return openAuthPromptModal("سجّل دخولك أولاً لنشر البوستات.");
      const text = document.getElementById("post-input").value.trim();
      const catSelect = document.getElementById("post-cat").value;
      const catCustom = document.getElementById("post-cat-custom")?.value.trim();
      const cat = catSelect === "other" ? (catCustom || "") : catSelect;

      if (!text || text.length > 500) return;
      if (getQuota(me).remaining <= 0) return toast("لقد استنفذت حد النشر المسموح اليوم");
      const now = Date.now();

      try {
        const doc = await awDB.createDocument(
          APPWRITE_CFG.databaseId,
          APPWRITE_CFG.collections.posts,
          AW_ID.unique(),
          {
            userId: me.id,
            content: text,
            category: cat,
            likes: [],
            commentsJson: [],
            createdAt: now
          }
        );

        const post = {
          id: doc.$id,
          userId: me.id,
          content: text,
          category: cat,
          likes: [],
          comments: [],
          createdAt: now
        };
        db.posts.unshift(post);

        const followers = db.follows.filter((f) => f.followingId === me.id);
        for (const f of followers) {
          await notifyUser(f.followerId, "post", me.id, `قام ${getDisplayName(me)} بنشر بوست جديد`, "", post.id);
        }
        await processMentionsAndNotify(text, me, post.id);
        toast("تم نشر البوست بنجاح");
        render();
      } catch (err) {
        toast("تعذر نشر البوست: " + (err.message || ""));
      }
    }

    async function deletePost(id) {
      if (!requireAuth()) return;
      try {
        await awDB.deleteDocument(APPWRITE_CFG.databaseId, APPWRITE_CFG.collections.posts, id);
        db.posts = db.posts.filter((p) => p.id !== id);
        toast("تم حذف البوست");
        render();
      } catch (err) {
        toast("تعذر حذف البوست");
      }
    }

    async function toggleLike(id) {
      const me = currentUser();
      if (!me) return openAuthPromptModal("سجّل دخولك أولاً للإعجاب بالمنشورات.");
      const p = db.posts.find((x) => x.id === id);
      if (!p) return;
      const nextLikes = [...p.likes];
      const idx = nextLikes.indexOf(me.id);
      const isAdding = idx < 0;
      if (idx >= 0) nextLikes.splice(idx, 1);
      else nextLikes.push(me.id);

      try {
        await awDB.updateDocument(
          APPWRITE_CFG.databaseId,
          APPWRITE_CFG.collections.posts,
          id,
          { likes: nextLikes }
        );
        p.likes = nextLikes;
        if (isAdding && p.userId !== me.id) {
          await notifyUser(p.userId, "like", me.id, `أعجب ${getDisplayName(me)} بوستك`, "", p.id);
        }
        render();
      } catch (err) {
        toast("تعذر تحديث الإعجاب");
      }
    }

    async function addComment(e, postId) {
      e.preventDefault();
      const me = currentUser();
      if (!me) return openAuthPromptModal("سجّل دخولك أولاً لكتابة التعليقات.");
      const inp = document.getElementById(`cm-${postId}`);
      const text = inp.value.trim();
      if (!text || text.length > 500) return;
      const p = db.posts.find((x) => x.id === postId);
      if (!p) return;

      const newComment = {
        id: AW_ID.unique(),
        userId: me.id,
        content: text,
        createdAt: Date.now()
      };
      const updatedComments = [...p.comments, newComment];
      const commentsJsonPayload = updatedComments.map((c) => JSON.stringify(c));

      try {
        await awDB.updateDocument(
          APPWRITE_CFG.databaseId,
          APPWRITE_CFG.collections.posts,
          postId,
          { commentsJson: commentsJsonPayload }
        );
        p.comments = updatedComments;
        if (p.userId !== me.id) {
          await notifyUser(p.userId, "comment", me.id, `علق ${getDisplayName(me)} على بوستك`, "", p.id);
        }
        await processMentionsAndNotify(text, me, p.id);
        render();
      } catch (err) {
        toast("تعذر إضافة التعليق");
      }
    }

    async function toggleFollow(targetId) {
      const me = currentUser();
      if (!me) return openAuthPromptModal("سجّل دخولك أولاً لمتابعة الحسابات.");
      if (targetId === me.id) return;
      const existing = db.follows.find((f) => f.followerId === me.id && f.followingId === targetId);
      try {
        if (existing) {
          if (existing.id) {
            await awDB.deleteDocument(APPWRITE_CFG.databaseId, APPWRITE_CFG.collections.follows, existing.id);
          }
          db.follows = db.follows.filter((f) => !(f.followerId === me.id && f.followingId === targetId));
        } else {
          const doc = await awDB.createDocument(
            APPWRITE_CFG.databaseId,
            APPWRITE_CFG.collections.follows,
            AW_ID.unique(),
            {
              followerId: me.id,
              followingId: targetId,
              createdAt: Date.now()
            }
          );
          db.follows.push({ id: doc.$id, followerId: me.id, followingId: targetId, createdAt: Number(doc.createdAt || Date.now()) });
          await notifyUser(targetId, "follow", me.id, `بدأ ${getDisplayName(me)} بمتابعتك`);
        }
        render();
      } catch (err) {
        toast("تعذر تحديث المتابعة");
      }
    }

    async function toggleBlockUser(targetId) {
      const me = currentUser();
      if (!me) return openAuthPromptModal("سجّل دخولك أولاً لحظر المستخدمين.");
      const nextBlocked = [...(me.blockedUsers || [])];
      const idx = nextBlocked.indexOf(targetId);
      const isBlocking = idx < 0;
      if (idx >= 0) nextBlocked.splice(idx, 1);
      else nextBlocked.push(targetId);

      try {
        await awDB.updateDocument(
          APPWRITE_CFG.databaseId,
          APPWRITE_CFG.collections.users,
          me.id,
          { blockedUsers: nextBlocked }
        );
        me.blockedUsers = nextBlocked;
        toast(isBlocking ? "تم حظر المستخدم" : "تم إلغاء الحظر");
        render();
      } catch (err) {
        toast("تعذر تحديث الحظر");
      }
    }

    async function startChat(targetId) {
      const me = currentUser();
      if (!me) return openAuthPromptModal("سجّل دخولك أولاً لبدء مراسلة مباشرة.");
      const target = getUser(targetId);
      if (!target || me.role === "admin" || target.role === "admin") {
        return toast("عذراً، الحساب الإداري لا يستخدم المحادثات المباشرة");
      }
      let conv = db.conversations.find((c) =>
        (c.user1Id === me.id && c.user2Id === targetId) ||
        (c.user1Id === targetId && c.user2Id === me.id)
      );
      if (!conv) {
        try {
          const now = Date.now();
          const doc = await awDB.createDocument(
            APPWRITE_CFG.databaseId,
            APPWRITE_CFG.collections.conversations,
            AW_ID.unique(),
            {
              user1Id: me.id,
              user2Id: targetId,
              messagesJson: JSON.stringify([]),
              lastMessageAt: now
            }
          );
          conv = {
            id: doc.$id,
            user1Id: me.id,
            user2Id: targetId,
            lastMessageAt: now,
            messages: []
          };
          db.conversations.unshift(conv);
        } catch (err) {
          return toast("تعذر فتح المحادثة");
        }
      }
      ui.activeChatId = conv.id;
      ui.view = "chat";
      render();
    }

    function renderChat() {
      const me = currentUser();
      if (!me) return renderAuth();
      if (me.role === "admin") return `<div class="card">حساب الإدارة لا يدعم المحادثات المباشرة.</div>`;
      const myConvs = db.conversations.filter((c) => c.user1Id === me.id || c.user2Id === me.id)
        .sort((a, b) => b.lastMessageAt - a.lastMessageAt);
      const active = myConvs.find((c) => c.id === ui.activeChatId) || myConvs[0] || null;
      if (active) ui.activeChatId = active.id;
      const other = active ? getUser(active.user1Id === me.id ? active.user2Id : active.user1Id) : null;
      const peers = db.users.filter((u) => u.id !== me.id && !u.disabled && u.role !== "admin" && !(me.blockedUsers || []).includes(u.id));

      return `
        <div class="chat-box">
          <aside class="chat-list">
            <div class="row-between" style="padding:14px;border-bottom:1px solid var(--border)">
              <strong style="font-size:15px">${t("chat")}</strong>
              <select class="input" style="width:auto;padding:5px 8px;font-size:12px" onchange="if(this.value) startChat(this.value)">
                <option value="">+ محادثة جديدة</option>
                ${peers.map((p) => `<option value="${esc(p.id)}">${esc(getDisplayName(p))}</option>`).join("")}
              </select>
            </div>
            <div>
              ${myConvs.map((c) => {
                const o = getUser(c.user1Id === me.id ? c.user2Id : c.user1Id);
                return `<button onclick="ui.activeChatId='${esc(c.id)}';render()" style="width:100%;text-align:start;border:none;border-bottom:1px solid var(--border);padding:12px 14px;background:${active && active.id === c.id ? "var(--surface-tint)" : "var(--surface)"}; color:var(--ink)">
                  <div class="row-between"><strong>${esc(o ? getDisplayName(o) : "")}</strong><span class="muted tabular">${c.messages.length}/100</span></div>
                  <div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.messages[c.messages.length - 1]?.content || "محادثة جديدة")}</div>
                </button>`;
              }).join("") || `<div class="muted" style="padding:20px;text-align:center">لا توجد محادثات نشطة</div>`}
            </div>
          </aside>
          <section class="chat-thread">
            ${!active || !other ? `<div class="muted" style="margin:auto">اختر محادثة لبدء المراسلة.</div>` : `
              <div class="row-between" style="padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border)">
                <div>
                  <strong>${esc(getDisplayName(other))}</strong> ${badgeHtml(other)}
                  <div class="muted tabular">${active.messages.length} / 100 رسالة (تحذف تلقائياً بعد 24 ساعة)</div>
                </div>
                <div class="row">
                  <button class="btn btn-danger" onclick="reportChat('${esc(active.id)}')">${t("report")}</button>
                  <button class="btn btn-ghost" onclick="toggleBlockUser('${esc(other.id)}')">${t("block")}</button>
                </div>
              </div>
              <div class="chat-msgs">
                ${active.messages.map((m) => `
                  <div class="bubble ${m.senderId === me.id ? "mine" : "theirs"}">
                    <div>${esc(m.content)}</div>
                    <div style="font-size:10px;opacity:0.75;margin-top:3px">${relTime(m.createdAt)}</div>
                  </div>`).join("") || `<div class="muted" style="text-align:center;margin:auto">ابدأ المراسلة الآن...</div>`}
              </div>
              ${active.messages.length >= 100
                ? `<div class="muted" style="padding:14px;text-align:center;background:var(--surface)">تم الوصول للحد الأقصى للمحادثة</div>`
                : `<form class="row" style="padding:12px;background:var(--surface);border-top:1px solid var(--border)" onsubmit="sendMsg(event, '${esc(active.id)}')">
                    <input id="msg-in" class="input" maxlength="500" placeholder="اكتب رسالة نصية..." />
                    <button class="btn btn-primary" type="submit">إرسال</button>
                  </form>`}
            `}
          </section>
        </div>`;
    }

    async function sendMsg(e, convId) {
      e.preventDefault();
      const me = currentUser();
      if (!me) return openAuthPromptModal();
      const conv = db.conversations.find((c) => c.id === convId);
      if (!conv || conv.messages.length >= 100) return;
      const text = document.getElementById("msg-in").value.trim();
      if (!text || text.length > 500) return;
      const now = Date.now();
      const nextMsgs = [...conv.messages, { id: AW_ID.unique(), senderId: me.id, content: text, createdAt: now }];

      try {
        await awDB.updateDocument(
          APPWRITE_CFG.databaseId,
          APPWRITE_CFG.collections.conversations,
          convId,
          {
            messagesJson: JSON.stringify(nextMsgs),
            lastMessageAt: now
          }
        );
        conv.messages = nextMsgs;
        conv.lastMessageAt = now;
        render();
      } catch (err) {
        toast("تعذر إرسال الرسالة");
      }
    }

    function reportChat(convId) {
      if (!requireAuth()) return;
      const conv = db.conversations.find((c) => c.id === convId);
      if (!conv) return;
      document.getElementById("modal-root").innerHTML = `
        <div class="modal-backdrop">
          <div class="modal-card stack">
            <h3>الإبلاغ عن المحادثة</h3>
            <textarea id="rep-reason" rows="3" maxlength="300" placeholder="سبب الإبلاغ..."></textarea>
            <div class="row" style="justify-content:flex-end">
              <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
              <button class="btn btn-danger" onclick="confirmReport('${esc(convId)}')">إرسال البلاغ</button>
            </div>
          </div>
        </div>`;
    }

    function confirmReport(convId) {
      const me = currentUser();
      if (!me) return;
      const conv = db.conversations.find((c) => c.id === convId);
      if (!conv) return closeModal();
      const reason = document.getElementById("rep-reason").value.trim() || "مخالفة";
      db.reports.unshift({
        id: AW_ID.unique(), reporterId: me.id, conversationId: convId, reason, status: "open",
        snapshot: conv.messages.slice(-15).map((m) => ({ username: getDisplayName(getUser(m.senderId)) || "مستخدم", content: m.content })),
        createdAt: Date.now(),
      });
      save();
      closeModal();
      toast("تم إرسال البلاغ مع السجل للإدارة");
    }

    function closeModal() {
      document.getElementById("modal-root").innerHTML = "";
    }

    async function markAllRead() {
      const me = currentUser();
      if (!me) return;
      const unreadList = db.notifications.filter((n) => n.userId === me.id && !n.isRead);

            APPWRITE_CFG.databaseId,

        } catch {}

      render();

    async function sendBroadcastNotification(e) {
      e.preventDefault();
      const title = document.getElementById("bc-title").value.trim();
      const msg = document.getElementById("bc-msg").value.trim();
      if (!title || !msg) return;

      for (const u of db.users) {
        if (u.role !== "admin") {
          await notifyUser(u.id, "admin", null, msg, title);
        }
      }
      toast("تم إرسال التنشيط العام لجميع المستخدمين بنجاح");
      document.getElementById("bc-title").value = "";
      document.getElementById("bc-msg").value = "";
    }

    async function adminApproveVerify(reqId) {
      const r = (db.verificationRequests || []).find((x) => x.id === reqId);
      if (!r) return;
      try {
        await awDB.updateDocument(
          APPWRITE_CFG.databaseId,
          APPWRITE_CFG.collections.verificationRequests,
          reqId,
          { status: "approved" }
        );
        r.status = "approved";
        const u = getUser(r.userId);
        if (u) {
          await awDB.updateDocument(
            APPWRITE_CFG.databaseId,
            APPWRITE_CFG.collections.users,
            u.id,
            { verified: true }
          );
          u.verified = true;
          await notifyUser(u.id, "admin", null, "تم قبول طلب توثيق حسابك ومنحك شارة التوثيق الزرقاء ✓", "تم توثيق الحساب");
        }
        toast("تم قبول طلب التوثيق وتوثيق الحساب بنجاح");
        render();
      } catch (err) {
        toast("تعذر قبول طلب التوثيق");
      }
    }

    async function adminRejectVerify(reqId) {
      const r = (db.verificationRequests || []).find((x) => x.id === reqId);
      if (!r) return;
      try {
        await awDB.updateDocument(
          APPWRITE_CFG.databaseId,
          APPWRITE_CFG.collections.verificationRequests,
          reqId,
          { status: "rejected" }
        );
        r.status = "rejected";
        const u = getUser(r.userId);
        if (u) {
          await notifyUser(u.id, "admin", null, "عذراً، تم رفض طلب توثيق الحساب المقدم من قِبل الإدارة.", "طلب التوثيق");
        }
        toast("تم رفض الطلب");
        render();
      } catch (err) {
        toast("تعذر رفض الطلب");
      }
    }

    async function adminVerify(id) {
      const u = getUser(id); if (!u) return;
      const nextVal = !u.verified;
      try {
        await awDB.updateDocument(APPWRITE_CFG.databaseId, APPWRITE_CFG.collections.users, id, { verified: nextVal });
        u.verified = nextVal;
        render();
      } catch {
        toast("تعذر تحديث حالة التوثيق");
      }
    }

    async function adminToggleDisable(id) {
      const u = getUser(id); if (!u || u.role === "admin") return;
      const nextVal = !u.disabled;
      try {
        await awDB.updateDocument(APPWRITE_CFG.databaseId, APPWRITE_CFG.collections.users, id, { disabled: nextVal });
        u.disabled = nextVal;
        toast(u.disabled ? "تم تعطيل الحساب" : "تم تنشيط الحساب");
        render();
      } catch {
        toast("تعذر تحديث حالة الحساب");
      }
    }

    async function adminUpdateQuota(id, val) {
      const u = getUser(id); if (!u) return;
      const limit = Math.max(1, parseInt(val) || 1);
      try {
        await awDB.updateDocument(APPWRITE_CFG.databaseId, APPWRITE_CFG.collections.users, id, { dailyPostLimit: limit });
        u.dailyPostLimit = limit;
        toast("تم تحديث الحصة اليومية");
      } catch {
        toast("تعذر تحديث الحصة");
      }
    }

    async function adminDeleteUser(id) {
      try {
        await awDB.deleteDocument(APPWRITE_CFG.databaseId, APPWRITE_CFG.collections.users, id);
        db.users = db.users.filter((u) => u.id !== id);
        db.posts = db.posts.filter((p) => p.userId !== id);
        render();
      } catch {
        toast("تعذر حذف المستخدم");
      }
    }

    function toggleRep(id) {
      const r = db.reports.find((x) => x.id === id);
      if (r) { r.status = r.status === "open" ? "resolved" : "open"; save(); render(); }
    }

    (async function initApp() {
      render();
      await syncAllFromAppwrite();
      checkInitialHash();
      render();
    })();
  </script>
</body>
</html>
